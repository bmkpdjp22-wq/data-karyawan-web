<script>
    const KATA_SANDI_LOGIN = "KapalApi";
    const BATAS_MENIT_TIDAK_AKTIF = 15;
    const BATAS_MS = BATAS_MENIT_TIDAK_AKTIF * 60 * 1000;
    const KEY_LOGIN = "bm_kpdjp_sudah_login";
    const KEY_AKTIVITAS_TERAKHIR = "bm_kpdjp_aktivitas_terakhir";
    let timerAutoKeluar = null;

    function toggleLihatSandi() {
      var inp = document.getElementById("inputSandiLogin");
      var btn = document.getElementById("btnIntipSandi");
      if (inp.type === "password") {
        inp.type = "text";
        btn.textContent = "Tutup";
      } else {
        inp.type = "password";
        btn.textContent = "Lihat";
      }
    }

    function sudahMelewatiBatasWaktu() {
      var terakhir = parseInt(sessionStorage.getItem(KEY_AKTIVITAS_TERAKHIR) || "0", 10);
      if (!terakhir) return false;
      return (Date.now() - terakhir) >= BATAS_MS;
    }

    function catatAktivitasDanResetTimer() {
      if (sessionStorage.getItem(KEY_LOGIN) !== "ya") return;
      if (sudahMelewatiBatasWaktu()) {
        logoutDashboard();
        return;
      }
      sessionStorage.setItem(KEY_AKTIVITAS_TERAKHIR, String(Date.now()));
      clearTimeout(timerAutoKeluar);
      timerAutoKeluar = setTimeout(logoutDashboard, BATAS_MS);
    }

    function aktifkanPantauanAktivitas() {
      ["mousemove", "mousedown", "keydown", "scroll", "touchstart", "click"].forEach(function(evt) {
        window.addEventListener(evt, catatAktivitasDanResetTimer, { passive: true });
      });
      document.addEventListener("visibilitychange", function() {
        if (!document.hidden && sessionStorage.getItem(KEY_LOGIN) === "ya") {
          if (sudahMelewatiBatasWaktu()) logoutDashboard();
          else catatAktivitasDanResetTimer();
        }
      });
      catatAktivitasDanResetTimer();
    }

    function bukaDashboardSesudahLogin() {
      document.getElementById("layarLogin").style.display = "none";
      document.getElementById("kontenDashboard").style.display = "flex";
      aktifkanPantauanAktivitas();
    }

    function cekLoginDashboard() {
      var inputSandi = document.getElementById("inputSandiLogin").value;
      var pesanSalah = document.getElementById("pesanSalahLogin");
      if (inputSandi === KATA_SANDI_LOGIN) {
        sessionStorage.setItem(KEY_LOGIN, "ya");
        sessionStorage.setItem(KEY_AKTIVITAS_TERAKHIR, String(Date.now()));
        pesanSalah.style.display = "none";
        bukaDashboardSesudahLogin();
      } else {
        pesanSalah.style.display = "block";
      }
    }

    function logoutDashboard() {
      clearTimeout(timerAutoKeluar);
      sessionStorage.removeItem(KEY_LOGIN);
      sessionStorage.removeItem(KEY_AKTIVITAS_TERAKHIR);
      location.reload();
    }

    if (sessionStorage.getItem(KEY_LOGIN) === "ya") {
      if (sudahMelewatiBatasWaktu()) logoutDashboard();
      else bukaDashboardSesudahLogin();
    }

    const KOLOM_UTAMA = [
      "Nomor",
      "NIP",
      "Nama Lengkap (Sesuai KTP)",
      "Jabatan",
      "Divisi",
      "Jenis Kelamin",
      "Tempat Lahir",
      "Tanggal Lahir",
      "Usia",
      "Alamat KTP",
      "RT",
      "RW",
      "Kelurahan / Desa",
      "Kecamatan",
      "Kota / Kabupaten",
      "Provinsi",
      "Alamat Tempat Tinggal Selama Bekerja",
      "Nomor KK (Kartu Keluarga)",
      "NIK KTP (Nomor Induk Kependudukan)",
      "NPWP",
      "Nomor Handphone (Whatsapp Aktif)",
      "Golongan Darah",
      "Tinggi Badan",
      "Berat Badan",
      "Nomor BPJS Kesehatan",
      "Nomor BPJS Ketenagakerjaan",
      "Alamat Email",
      "Nomor Rekening Mandiri",
      "Nomor Rekening Bank Lain",
      "Tempat Tinggal Selama Bekerja",
      "Status Perkawinan",
      "Jumlah Tanggungan Anak",
      "Kontak Darurat",
      "Nama Kontak Darurat",
      "Hubungan Dengan Kontak Darurat",
      "Pendidikan Terakhir",
      "Jurusan Pendidikan Terakhir",
      "Nama Sekolah Pendidikan Terakhir",
      "Ukuran Baju",
      "Ukuran Celana",
      "Ukuran Sepatu"
    ];

    const URUTAN_DIVISI = [
      "Management Office",
      "Engineering",
      "Security",
      "Housekeeping",
      "Banquet",
      "Driver",
      "Receptionist"
    ];

    const URL_DATA = "https://script.google.com/macros/s/AKfycbzKrn6vwNSM5hJGywoYmEXzKwA_rjFKeu9YRQq3lcNdYyO6Z0wIgNC2PYU1DmKNtm7l/exec";
    const URL_PELANGGARAN = "https://script.google.com/macros/s/AKfycbxsnb6ZUzIpdbmdiGeNaJiasl9nCqAdGcCRO_n5XtDZpReCZ2SZJw-4ZusstYiNB5EX/exec";
    const SPREADSHEET_PELANGGARAN_ID = "1nVDFew5Ug96BN0j_w7aZ_gA6DiF43IMBwZIzFEWP7Pk";
    const GID_PELANGGARAN = "642420235";
    const CACHE_KEY = "cachePersonelKpdjp2026_v14_jabatan_divisi";
    const CACHE_PELANGGARAN_KEY = "cachePelanggaranKpdjp2026_v14";
    const DURASI_CACHE_MS = 24 * 60 * 60 * 1000;

    const KOLOM_PELANGGARAN = [
      "No",
      "NIP",
      "Nama",
      "Jabatan",
      "Devisi",
      "Tanggal Pelanggaran",
      "Jenis Pelanggaran",
      "Poin Pelanggaran",
      "Total Poin"
    ];

    let modeTema = localStorage.getItem("modeTemaKpdjp") || "auto";
    let filterGenderAktif = "";
    let halamanAktif = "personel";

    const BATAS_PELANGGARAN_AWAL = 50;
    let batasPelanggaranTampil = BATAS_PELANGGARAN_AWAL;
    let semuaPelanggaran = [];
    let pelanggaranIndeks = [];
    let hasilPelanggaranTerakhir = [];
    let barisPelanggaranDitampilkan = [];
    let grupPelanggaranTerbuka = {};

    function urutkanKolomJabatanSebelumDivisi(arr) {
      var list = Array.isArray(arr) ? arr.slice() : [];
      var idxJab = -1, idxDiv = -1;
      for (var i = 0; i < list.length; i++) {
        var low = String(list[i] || "").trim().toLowerCase();
        if (low === "jabatan") idxJab = i;
        if (low === "divisi" || low === "devisi") idxDiv = i;
      }
      if (idxJab !== -1 && idxDiv !== -1 && idxJab > idxDiv) {
        var colJab = list.splice(idxJab, 1)[0];
        var newIdxDiv = -1;
        for (var j = 0; j < list.length; j++) {
          var low2 = String(list[j] || "").trim().toLowerCase();
          if (low2 === "divisi" || low2 === "devisi") { newIdxDiv = j; break; }
        }
        if (newIdxDiv !== -1) {
          list.splice(newIdxDiv, 0, colJab);
        }
      }
      return list;
    }

    function susunDaftarKolom() {
      return urutkanKolomJabatanSebelumDivisi(KOLOM_UTAMA);
    }

    function parseAngka(val) {
      var n = parseFloat(String(val || "0").replace(/[^0-9.-]/g, ""));
      return isNaN(n) ? 0 : n;
    }

    function kunciIdentitasOrang(r) {
      if (!r || typeof r !== "object") return "";
      var nip = String(r["NIP"] || r["nip"] || "").trim();
      var nama = normalisasiNamaOrang(r["Nama"] || r["Nama Lengkap (Sesuai KTP)"] || r["nama"] || "");
      if (nip && nip !== "-" && nip !== "0") return "nip_" + nip.toLowerCase();
      if (nama) return "nama_" + nama;
      return "";
    }

    function ekstrakArrayPelanggaran(json) {
      if (!json) return [];
      if (Array.isArray(json)) return json;
      if (Array.isArray(json.data)) return json.data;
      if (Array.isArray(json.rows)) return json.rows;
      if (Array.isArray(json.records)) return json.records;
      return [];
    }

    function normalisasiBarisPelanggaran(raw) {
      if (!Array.isArray(raw)) return [];
      return raw.map(function(item, idx) {
        var r = item && typeof item === "object" ? item : {};
        var noVal = String(r["No"] || r["no"] || r["Nomor"] || r["nomor"] || (idx + 1)).trim();
        var nipVal = String(r["NIP"] || r["nip"] || "").trim();
        var namaVal = String(r["Nama"] || r["Nama Lengkap (Sesuai KTP)"] || r["Nama Karyawan"] || r["nama"] || "").trim();
        var jabVal = String(r["Jabatan"] || r["jabatan"] || r["Posisi"] || "").trim();
        var divRaw = String(r["Devisi"] || r["devisi"] || r["Divisi"] || r["divisi"] || r["Departemen"] || r["Unit"] || "").trim();
        var divNorm = normalisasiNamaDivisi(divRaw, jabVal);
        var divTampil = divNorm || divRaw || "-";
        var tglVal = String(r["Tanggal Pelanggaran"] || r["Tanggal"] || r["tanggal"] || "").trim();
        var jenisVal = String(r["Jenis Pelanggaran"] || r["Pelanggaran"] || r["Keterangan"] || "").trim();
        var poinVal = String(r["Poin Pelanggaran"] || r["Poin"] || r["poin"] || "0").trim();
        var totalVal = String(r["Total Poin"] || r["Total"] || r["Akumulasi Poin"] || poinVal || "0").trim();

        return {
          "No": noVal,
          "NIP": nipVal || "-",
          "Nama": namaVal,
          "Jabatan": jabVal || "-",
          "Devisi": divTampil,
          "Divisi": divTampil,
          "Tanggal Pelanggaran": tglVal || "-",
          "Jenis Pelanggaran": jenisVal || "-",
          "Poin Pelanggaran": poinVal,
          "Total Poin": totalVal
        };
      }).filter(function(row) {
        var n = String(row["Nama"] || "").trim().toLowerCase();
        return n && n !== "nama" && n !== "total" && n !== "jumlah";
      });
    }

    function bangunDivisiPelanggaran() {
      var hitung = {};
      for (var i = 0; i < pelanggaranIndeks.length; i++) {
        var d = pelanggaranIndeks[i].div;
        if (d) {
          hitung[d] = (hitung[d] || 0) + 1;
        }
      }
      var listDiv = URUTAN_DIVISI.filter(function(d) { return hitung[d] > 0; });
      Object.keys(hitung).forEach(function(d) {
        if (listDiv.indexOf(d) === -1 && hitung[d] > 0) listDiv.push(d);
      });

      var sel = document.getElementById("filterDivisiPelanggaran");
      var divAktif = sel ? sel.value : "";
      if (sel) {
        sel.innerHTML = '<option value="">Semua Divisi</option>' +
          listDiv.map(function(d) {
            return '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + ' (' + hitung[d] + ')</option>';
          }).join("");
        sel.value = listDiv.indexOf(divAktif) !== -1 ? divAktif : "";
      }

      var wrapKartu = document.getElementById("kartuDivisiPelanggaran");
      if (wrapKartu) {
        wrapKartu.innerHTML = listDiv.map(function(d) {
          var aktif = (sel && sel.value === d) ? " aktif" : "";
          var amanAttr = escapeHtml(d);
          var amanJs = d.replace(/'/g, "\\'");
          return '<div class="card' + aktif + '" data-div="' + amanAttr + '" onclick="pilihDivisiPelanggaran(\'' + amanJs + '\')"><b>' + amanAttr + '</b><div class="card-sub">' + hitung[d] + ' data</div></div>';
        }).join("");
      }
    }

    function pilihDivisiPelanggaran(d) {
      batasPelanggaranTampil = BATAS_PELANGGARAN_AWAL;
      var sel = document.getElementById("filterDivisiPelanggaran");
      if (sel) sel.value = d || "";
      document.querySelectorAll("#kartuDivisiPelanggaran .card").forEach(function(c) {
        var judul = c.querySelector("b") ? c.querySelector("b").textContent.trim() : "";
        c.classList.toggle("aktif", Boolean(d) && judul === d);
      });
      renderTabelPelanggaran();
    }

    function resetFilterPelanggaran() {
      batasPelanggaranTampil = BATAS_PELANGGARAN_AWAL;
      var cari = document.getElementById("cariPelanggaran");
      if (cari) cari.value = "";
      pilihDivisiPelanggaran("");
    }

    function muatLebihBanyakPelanggaran() {
      batasPelanggaranTampil += 50;
      renderTabelPelanggaran();
    }

    function tampilkanSemuaBarisPelanggaran() {
      batasPelanggaranTampil = pelanggaranIndeks.length || semuaPelanggaran.length;
      renderTabelPelanggaran();
    }

    function ringkasKeAwalPelanggaran() {
      batasPelanggaranTampil = BATAS_PELANGGARAN_AWAL;
      renderTabelPelanggaran();
    }

    function toggleDropdownPelanggaran(kunciGrup, ev) {
      if (ev) ev.stopPropagation();
      if (grupPelanggaranTerbuka[kunciGrup]) {
        delete grupPelanggaranTerbuka[kunciGrup];
      } else {
        grupPelanggaranTerbuka[kunciGrup] = true;
      }
      renderTabelPelanggaran();
    }

    function normalisasiNamaOrang(nama) {
      return String(nama || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function bangunKamussNipPersonel() {
      var kamus = {};
      if (!Array.isArray(semuaData) || !semuaData.length) return kamus;
      for (var i = 0; i < semuaData.length; i++) {
        var r = semuaData[i] || {};
        var nip = getNip(r);
        if (!nip || nip === "-" || nip === "0") continue;
        var namaAsli = String(r["Nama Lengkap (Sesuai KTP)"] || r.Nama || r.nama || "").trim();
        var kNorm = normalisasiNamaOrang(namaAsli);
        if (kNorm && !kamus[kNorm]) {
          kamus[kNorm] = nip;
        }
      }
      return kamus;
    }

    function lengkapiNipPelanggaranDariPersonel() {
      var kamusNip = bangunKamussNipPersonel();
      var keys = Object.keys(kamusNip);
      if (!keys.length || !Array.isArray(semuaPelanggaran) || !semuaPelanggaran.length) return;

      for (var i = 0; i < semuaPelanggaran.length; i++) {
        var row = semuaPelanggaran[i];
        var nipSaatIni = String(row["NIP"] || "").trim();
        if (nipSaatIni && nipSaatIni !== "-" && nipSaatIni !== "0") continue;

        var namaPel = normalisasiNamaOrang(row["Nama"]);
        if (!namaPel) continue;

        if (kamusNip[namaPel]) {
          row["NIP"] = kamusNip[namaPel];
          continue;
        }

        for (var k = 0; k < keys.length; k++) {
          var cand = keys[k];
          if (cand.length >= 5 && (cand.indexOf(namaPel) !== -1 || namaPel.indexOf(cand) !== -1)) {
            row["NIP"] = kamusNip[cand];
            break;
          }
        }
      }
    }

    function segarkanIndeksPelanggaranSetelahNip() {
      if (!Array.isArray(semuaPelanggaran) || !semuaPelanggaran.length) return;
      lengkapiNipPelanggaranDariPersonel();
      pelanggaranIndeks = semuaPelanggaran.map(function(r) {
        var divNorm = normalisasiNamaDivisi(r["Devisi"], r["Jabatan"]);
        var gabungan = [divNorm];
        for (var k = 0; k < KOLOM_PELANGGARAN.length; k++) {
          var v = r[KOLOM_PELANGGARAN[k]];
          if (v) gabungan.push(String(v));
        }
        return {
          raw: r,
          div: divNorm,
          poin: parseAngka(r["Poin Pelanggaran"]),
          teksCari: gabungan.join(" ").toLowerCase()
        };
      });
      if (halamanAktif === "pelanggaran") {
        renderTabelPelanggaran();
      }
    }

    function prosesDataPelanggaran(raw, labelTambahan) {
      semuaPelanggaran = normalisasiBarisPelanggaran(raw);
      lengkapiNipPelanggaranDariPersonel();
      grupPelanggaranTerbuka = {};
      pelanggaranIndeks = semuaPelanggaran.map(function(r) {
        var divNorm = normalisasiNamaDivisi(r["Devisi"], r["Jabatan"]);
        var gabungan = [divNorm];
        for (var k = 0; k < KOLOM_PELANGGARAN.length; k++) {
          var v = r[KOLOM_PELANGGARAN[k]];
          if (v) gabungan.push(String(v));
        }
        return {
          raw: r,
          div: divNorm,
          poin: parseAngka(r["Poin Pelanggaran"]),
          teksCari: gabungan.join(" ").toLowerCase()
        };
      });

      var kolomPelUrut = urutkanKolomJabatanSebelumDivisi(KOLOM_PELANGGARAN);
      document.getElementById("kepalaTabelPelanggaran").innerHTML = kolomPelUrut.map(function(k) {
        return "<th>" + escapeHtml(k) + "</th>";
      }).join("");

      bangunDivisiPelanggaran();
      renderTabelPelanggaran(labelTambahan);
    }

    function renderTabelPelanggaran(labelTambahan) {
      var kata = (document.getElementById("cariPelanggaran").value || "").toLowerCase().trim();
      var div = document.getElementById("filterDivisiPelanggaran").value;

      var tersaring = [];
      var totalPoin = 0;
      var setKaryawan = {};
      var grupList = [];
      var petaGrup = {};

      for (var i = 0; i < pelanggaranIndeks.length; i++) {
        var item = pelanggaranIndeks[i];
        var okD = !div || item.div === div;
        var okK = !kata || item.teksCari.indexOf(kata) !== -1;
        if (okD && okK) {
          tersaring.push(item.raw);
          totalPoin += item.poin;
          var kunciOrang = kunciIdentitasOrang(item.raw);
          if (kunciOrang) setKaryawan[kunciOrang] = true;

          var kunciGrup = kunciOrang || ("row_" + i);
          if (!petaGrup[kunciGrup]) {
            petaGrup[kunciGrup] = {
              key: kunciGrup,
              items: [],
              jumlahPoin: 0
            };
            grupList.push(petaGrup[kunciGrup]);
          }
          petaGrup[kunciGrup].items.push(item.raw);
          petaGrup[kunciGrup].jumlahPoin += item.poin;
        }
      }

      hasilPelanggaranTerakhir = tersaring;
      var potonganGrup = grupList.slice(0, batasPelanggaranTampil);

      var judul = "Daftar Poin Pelanggaran (Sheet ALL)";
      if (div) judul += " • " + div;
      document.getElementById("judulTabelPelanggaran").textContent = judul;

      var suffix = labelTambahan ? " " + labelTambahan : "";
      document.getElementById("infoPelanggaran").textContent =
        "Menampilkan " + potonganGrup.length + " dari " + grupList.length + " personel (" + tersaring.length + " catatan pelanggaran cocok, " + semuaPelanggaran.length + " total di sheet ALL)" + suffix;

      document.getElementById("valPelTampil").textContent = tersaring.length;
      document.getElementById("valPelTotalPoin").textContent = totalPoin;
      document.getElementById("valPelKaryawan").textContent = Object.keys(setKaryawan).length;
      document.getElementById("valPelSemua").textContent = semuaPelanggaran.length;
      document.getElementById("infoBarisPelanggaran").textContent =
        "Personel tampil: " + potonganGrup.length + " dari " + grupList.length + " (" + tersaring.length + " catatan)";

      var lebihDari50Pel = grupList.length > BATAS_PELANGGARAN_AWAL;
      var masihAdaPel = potonganGrup.length < grupList.length;
      var sudahDiperluasPel = potonganGrup.length > BATAS_PELANGGARAN_AWAL;
      var navPel = document.getElementById("navigasiPelanggaranBawah");
      if (navPel) {
        navPel.style.display = lebihDari50Pel ? "flex" : "none";
        document.getElementById("btnPelTambah").style.display = masihAdaPel ? "inline-block" : "none";
        document.getElementById("btnPelSemua").style.display = masihAdaPel ? "inline-block" : "none";
        document.getElementById("btnPelRingkas").style.display = sudahDiperluasPel ? "inline-block" : "none";
      }

      if (!potonganGrup.length) {
        barisPelanggaranDitampilkan = [];
        document.getElementById("isiTabelPelanggaran").innerHTML =
          "<tr><td colspan='" + KOLOM_PELANGGARAN.length + "' style='text-align:center; padding:18px; color:var(--muted);'>Tidak ada data pelanggaran yang cocok pada sheet ALL.</td></tr>";
        return;
      }

      barisPelanggaranDitampilkan = [];
      var html = "";
      var kolomPelUrut = urutkanKolomJabatanSebelumDivisi(KOLOM_PELANGGARAN);

      for (var g = 0; g < potonganGrup.length; g++) {
        var grp = potonganGrup[g];
        var daftar = grp.items;
        var jumlahCatatan = daftar.length;
        var terbuka = Boolean(grupPelanggaranTerbuka[grp.key]);
        var utama = daftar[0];
        var idxUtama = barisPelanggaranDitampilkan.length;
        barisPelanggaranDitampilkan.push(utama);

        var amanKey = grp.key.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        var tombolDropdown = "";
        if (jumlahCatatan > 1) {
          tombolDropdown = ' <button type="button" class="btn-dd-pel' + (terbuka ? " terbuka" : "") + '" title="' + (terbuka ? "Tutup rincian" : "Lihat " + jumlahCatatan + " pelanggaran") + '" onclick="toggleDropdownPelanggaran(\'' + amanKey + '\', event)">' +
            jumlahCatatan + 'x <span class="panah-dd">▼</span></button>';
        }

        var cells = "";
        for (var c = 0; c < kolomPelUrut.length; c++) {
          var col = kolomPelUrut[c];
          var val = utama[col] || "-";
          if (col === "Total Poin" && (val === "-" || val === "")) {
            val = String(grp.jumlahPoin);
          }
          var aman = escapeHtml(val);

          if (col === "No") {
            cells += "<td><span class='cell-nowrap'>" + String(g + 1) + "</span></td>";
          } else if (col === "Nama") {
            cells += "<td><div class='nama-wrap-dd'><span class='cell-nama' title='" + aman + "'><span class='avatar'>" + inisial(val) + "</span><span class='nama-teks'>" + aman + "</span></span>" + tombolDropdown + "</div></td>";
          } else if (col === "Poin Pelanggaran" || col === "Total Poin") {
            cells += "<td>" + (val !== "-" ? '<span class="pel-poin-badge">' + aman + "</span>" : "-") + "</td>";
          } else if (col === "Jenis Pelanggaran") {
            var teksJenis = jumlahCatatan > 1 && !terbuka
              ? escapeHtml(val) + ' <span style="color:var(--muted); font-size:11px;">(+' + (jumlahCatatan - 1) + ' lainnya)</span>'
              : aman;
            cells += "<td><div class='cell-pendek' title='" + aman + "'>" + teksJenis + "</div></td>";
          } else if (col === "Jabatan") {
            cells += "<td><div class='cell-pendek' title='" + aman + "'>" + aman + "</div></td>";
          } else {

    function parseCsvBaris(teks) {
      var hasil = [], baris = [], sel = "", dalamKutipan = false;
      for (var i = 0; i < teks.length; i++) {
        var ch = teks[i], next = teks[i + 1];
        if (ch === '"') {
          if (dalamKutipan && next === '"') { sel += '"'; i++; }
          else { dalamKutipan = !dalamKutipan; }
        } else if (ch === "," && !dalamKutipan) {
          baris.push(sel.trim()); sel = "";
        } else if ((ch === "\n" || (ch === "\r" && next === "\n")) && !dalamKutipan) {
          if (ch === "\r") i++;
          baris.push(sel.trim()); hasil.push(baris); baris = []; sel = "";
        } else if (ch === "\r" && !dalamKutipan) {
          baris.push(sel.trim()); hasil.push(baris); baris = []; sel = "";
        } else {
          sel += ch;
        }
      }
      if (sel.length > 0 || baris.length > 0) { baris.push(sel.trim()); hasil.push(baris); }
      return hasil;
    }

    function ambilPelanggaranViaGviz() {

        GID_PELANGGARAN +

      return fetch(urlCsv, { redirect: "follow" })
        .then(function(res) {
          if (!res.ok) throw new Error("GViz HTTP " + res.status);
          return res.text();
        })
        .then(function(csvText) {
          if (!csvText || csvText.trim().indexOf("<!DOCTYPE") === 0 || csvText.trim().indexOf("<html") === 0) {
            throw new Error("Spreadsheet belum dapat dibaca publik.");
          }
          var matriks = parseCsvBaris(csvText);
          var idxHeader = -1;
          for (var r = 0; r < matriks.length; r++) {
            var rowLower = matriks[r].map(function(c) { return String(c || "").trim().toLowerCase(); });
            if (rowLower.indexOf("no") !== -1 && (rowLower.indexOf("nama") !== -1 || rowLower.indexOf("nip") !== -1)) {
              idxHeader = r;
              break;
            }
          }
          if (idxHeader === -1) return [];
          var headers = matriks[idxHeader].map(function(h) { return String(h || "").trim(); });
          var listObj = [];
          for (var i = idxHeader + 1; i < matriks.length; i++) {
            var row = matriks[i], obj = {};
            for (var c = 0; c < headers.length; c++) {
              if (headers[c]) obj[headers[c]] = String(row[c] ?? "").trim();
            }
            var namaCek = String(obj["Nama"] || "").trim();
            var namaLower = namaCek.toLowerCase();
            if (!namaCek || namaLower === "total" || namaLower === "jumlah" || namaLower.indexOf("grand total") === 0) continue;
            if (!obj["No"]) obj["No"] = String(listObj.length + 1);
            listObj.push(obj);
          }
          return listObj;
        });
    }

    function bacaCache() {
      try {
        var rawCache = localStorage.getItem(CACHE_KEY);
        if (!rawCache) return { ada: false, segar: false };
        var parsed = JSON.parse(rawCache);
        if (parsed && Array.isArray(parsed.data) && parsed.data.length) {
          var umur = Date.now() - (parsed.ts || 0);
          var masihSegar = umur < DURASI_CACHE_MS;
          prosesDataArray(parsed.data, masihSegar ? "(dari cache)" : "(menyegarkan di latar belakang...)");

      return { ada: false, segar: false };
    }

    function fetchDenganBatasWaktu(url, ms) {
      var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = controller ? setTimeout(function() { controller.abort(); }, ms) : null;
      var sep = url.indexOf("?") === -1 ? "?" : "&";
      return fetch(url + sep + "t=" + Date.now(), {
        method: "GET",
        redirect: "follow",
        signal: controller ? controller.signal : undefined
      }).finally(function() {
        if (timer) clearTimeout(timer);
      });
    }

      }
      var sep = ";";
      var barisCsv = [kolomList.map(function(k) { return '"' + String(k).replace(/"/g, '""') + '"'; }).join(sep)];
      hasilTerakhir.forEach(function(r) {
        var rowCsv = kolomList.map(function(k) {
          var val = r[k] || "";
          return '"' + String(val).replace(/[\r\n]+/g, " ").replace(/"/g, '""') + '"';
        }).join(sep);
        barisCsv.push(rowCsv);
      });
      var bom = "\uFEFF";
      var blob = new Blob([bom + barisCsv.join("\n")], { type: "text/csv;charset=utf-8;" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "data-personel-bm-kpdjp.csv";
      link.click();
    }

    function tampil(labelTambahan) {
      var kata = document.getElementById("cari").value.toLowerCase().trim();
      var div = document.getElementById("filterDivisi").value;

      var saringTanpaGender = [];
      var jmlLaki = 0;
      var jmlPerempuan = 0;

      for (var i = 0; i < dataIndeks.length; i++) {
        var item = dataIndeks[i];
        var okD = !div || item.div === div;
        var okK = !kata || item.teksCari.indexOf(kata) !== -1;
        if (okD && okK) {
          saringTanpaGender.push(item);
          if (item.isLaki) jmlLaki++;
          else if (item.isPerempuan) jmlPerempuan++;
        }
      }

      var saringRaw = [];
      for (var j = 0; j < saringTanpaGender.length; j++) {
        var it = saringTanpaGender[j];
        if (filterGenderAktif === "laki" && !it.isLaki) continue;
        if (filterGenderAktif === "perempuan" && !it.isPerempuan) continue;
        saringRaw.push(it.raw);
      }

      hasilTerakhir = saringRaw;
      perbaruiStatusGenderUI();

      var barisPotongan = saringRaw.slice(0, batasTampil);
      barisDitampilkan = barisPotongan;
      var suffix = labelTambahan ? " " + labelTambahan : "";
      var labelGender = filterGenderAktif === "laki" ? " [Laki - Laki]" : (filterGenderAktif === "perempuan" ? " [Perempuan]" : "");

      document.getElementById("infoStats").textContent = "Menampilkan " + barisPotongan.length + " dari " + saringRaw.length + " data cocok" + labelGender + " (" + semuaData.length + " total personel)" + suffix;
      document.getElementById("kpiTampil").textContent = saringRaw.length;
      document.getElementById("kpiLaki").textContent = jmlLaki;
      document.getElementById("kpiPerempuan").textContent = jmlPerempuan;
      document.getElementById("kpiTotalPersonel").textContent = semuaData.length;
      document.getElementById("infoBarisTabel").textContent = "Baris tampil: " + barisPotongan.length + " dari " + saringRaw.length;

      var lebihDari50 = saringRaw.length > BATAS_AWAL;
      var masihAda = barisPotongan.length < saringRaw.length;
      var sudahDiperluas = barisPotongan.length > BATAS_AWAL;

      document.getElementById("navigasiBawah").style.display = lebihDari50 ? "flex" : "none";
      document.getElementById("btnBawahTambah").style.display = masihAda ? "inline-block" : "none";
      document.getElementById("btnBawahSemua").style.display = masihAda ? "inline-block" : "none";
      document.getElementById("btnBawahRingkas").style.display = sudahDiperluas ? "inline-block" : "none";

      var listTr = new Array(barisPotongan.length);
      for (var p = 0; p < barisPotongan.length; p++) {
        var r = barisPotongan[p];
        var listTd = new Array(kolomList.length);
        for (var c = 0; c < kolomList.length; c++) {
          var k = kolomList[c];
          listTd[c] = "<td>" + formatSel(k, r[k], p + 1) + "</td>";
        }
        listTr[p] = '<tr class="data-row" data-idx="' + p + '">' + listTd.join("") + "</tr>";
      }
      document.getElementById("isiTabel").innerHTML = listTr.join("");
    }

    document.getElementById("isiTabel").addEventListener("click", function(e) {
      var tr = e.target.closest("tr.data-row[data-idx]");
      if (!tr) return;
      var idx = parseInt(tr.getAttribute("data-idx"), 10);
      var r = barisDitampilkan[idx];
      if (!r) return;
      dataModalAktif = r;
      var nama = r["Nama Lengkap (Sesuai KTP)"] || r.Nama || "Detail Personel";
      document.getElementById("modalJudul").textContent = nama;
      document.getElementById("detailIsi").innerHTML = kolomList.map(function(k) {
        return "<p style='margin:6px 0;'><b>" + escapeHtml(k) + ":</b> " + escapeHtml(r[k] || "-") + "</p>";
      }).join("");
      document.getElementById("modalAksiPersonel").style.display = "flex";
      document.getElementById("modalAksiUmum").style.display = "none";
      document.getElementById("modal").classList.add("aktif");
    });

    document.getElementById("isiTabelPelanggaran").addEventListener("click", function(e) {
      if (e.target.closest(".btn-dd-pel")) return;
      var tr = e.target.closest("tr.data-row[data-pel-idx]");
      if (!tr) return;
      var idx = parseInt(tr.getAttribute("data-pel-idx"), 10);
      var r = barisPelanggaranDitampilkan[idx];
      if (!r) return;
      dataModalAktif = null;
      document.getElementById("modalJudul").textContent = r["Nama"] || "Detail Pelanggaran";
      document.getElementById("detailIsi").innerHTML = urutkanKolomJabatanSebelumDivisi(KOLOM_PELANGGARAN).map(function(k) {
        return "<p style='margin:6px 0;'><b>" + escapeHtml(k) + ":</b> " + escapeHtml(r[k] || "-") + "</p>";
      }).join("");
      document.getElementById("modalAksiPersonel").style.display = "none";
      document.getElementById("modalAksiUmum").style.display = "flex";
      document.getElementById("modal").classList.add("aktif");
    });

    document.getElementById("cari").addEventListener("input", function() {
      batasTampil = BATAS_AWAL;
      clearTimeout(timerKetik);
      timerKetik = setTimeout(tampil, 120);
    });
    document.getElementById("filterDivisi").addEventListener("change", function(e) { pilihDivisi(e.target.value); });

    function perbaruiTampilanTema() {
      var jamWIB = new Date().toLocaleTimeString("id-ID", { timeZone: "Asia/Jakarta", hour12: false });
      var jamInt = parseInt(jamWIB.split(":")[0], 10);
      var pakaiMalam = modeTema === "dark" ? true : (modeTema === "light" ? false : (isNaN(jamInt) ? false : (jamInt >= 18 || jamInt < 6)));
      document.body.classList.toggle("mode-malam", pakaiMalam);

      var labelMode = modeTema === "dark" ? "Mode Gelap" : (modeTema === "light" ? "Mode Terang" : "Mode Otomatis");
      var infoJam = "WIB: " + jamWIB + " • " + labelMode;
      ["infoWaktuWIBPersonel", "infoWaktuWIBPelanggaran"].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.textContent = infoJam;
      });

      var labelTombol = modeTema === "dark" ? "Tema: Gelap" : (modeTema === "light" ? "Tema: Terang" : "Tema: Otomatis WIB");
      ["btnTemaPersonel", "btnTemaPelanggaran"].forEach(function(id) {
        var b = document.getElementById(id);
        if (b) b.textContent = labelTombol;
      });
    }

    function gantiModeTema() {
      modeTema = modeTema === "auto" ? "dark" : (modeTema === "dark" ? "light" : "auto");
      try { localStorage.setItem("modeTemaKpdjp", modeTema); } catch (e) {}
      perbaruiTampilanTema();
    }

    function pindahHalaman(hal) {
      halamanAktif = hal === "pelanggaran" ? "pelanggaran" : "personel";
      var secP = document.getElementById("halamanPersonel");
      var secV = document.getElementById("halamanPelanggaran");
      var btnP = document.getElementById("btnMenuDataPersonel");
      var btnV = document.getElementById("btnMenuPoinPelanggaran");

      if (secP) secP.style.display = halamanAktif === "personel" ? "flex" : "none";
      if (secV) secV.style.display = halamanAktif === "pelanggaran" ? "flex" : "none";
      if (btnP) btnP.classList.toggle("aktif", halamanAktif === "personel");
      if (btnV) btnV.classList.toggle("aktif", halamanAktif === "pelanggaran");

      if (halamanAktif === "pelanggaran") {
        muatPelanggaran(false);
      }
    }

    perbaruiTampilanTema();
    setInterval(perbaruiTampilanTema, 1000);
    muat(false);
  </script>
</body>
</html>
