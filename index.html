<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DATA PERSONEL & PELANGGARAN BM KPDJP 2026</title>
  <style>
    :root {
      --sidebar: #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --row-alt: #fafcff;
      --row-hover: #eff6ff;
      --th-bg: #f8fafc;
      --th-text: #334155;
      --pill-bg: #f1f5f9;
      --pill-text: #334155;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --danger-bg: #fef2f2;
      --danger-text: #dc2626;
      --danger-border: #fecaca;
      --hero: linear-gradient(135deg, #0f172a 0%, #1d4ed8 58%, #4338ca 100%);
      --shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.08);
    }

    body.mode-malam {
      --sidebar: #05070c;
      --sidebar-hover: #111827;
      --sidebar-active: #1d4ed8;
      --bg: #07090f;
      --card: #101522;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
      --row-alt: #0d121d;
      --row-hover: #172554;
      --th-bg: #131a2b;
      --th-text: #e2e8f0;
      --pill-bg: #1e293b;
      --pill-text: #e2e8f0;
      --primary: #3b82f6;
      --primary-soft: #172554;
      --danger-bg: #450a0a;
      --danger-text: #fca5a5;
      --danger-border: #7f1d1d;
      --hero: linear-gradient(135deg, #05070c 0%, #111c3a 58%, #1e1b4b 100%);
      --shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .wrap { display: flex; min-height: 100vh; }

    /* Sidebar */
    .side {
      width: 256px;
      background: var(--sidebar);
      color: #fff;
      padding: 18px 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 1px solid var(--border);
    }
    .side h3 {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.35;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .side-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin: 6px 6px 2px;
      font-weight: 700;
    }
    .nav-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      color: #cbd5e1;
      border: 0;
      padding: 9px 11px;
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 3px;
      font-size: 13px;
    }
    .nav-btn:hover { background: var(--sidebar-hover); color: #fff; }
    .nav-btn.aktif {
      background: var(--sidebar-active);
      color: #fff;
      font-weight: 600;
    }
    .nav-btn.aktif-merah {
      background: #dc2626;
      color: #fff;
      font-weight: 600;
    }
    .badge-jml {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Main Content */
    .main { flex: 1; padding: 20px 22px 36px; min-width: 0; }

    .hero {
      background: var(--hero);
      color: #fff;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero h1 { margin: 0 0 6px; font-size: 23px; font-weight: 800; }
    .hero p { margin: 0 0 14px; font-size: 13px; color: #dbeafe; }

    .jam-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f8fafc;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, button.act {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      font-size: 13px;
    }
    input {
      flex: 1;
      min-width: 210px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }
    select {
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    button.act {
      background: #e2e8f0;
      color: #0f172a;
      border-color: transparent;
      font-weight: 700;
      cursor: pointer;
    }
    button.act:hover { background: #cbd5e1; }
    button.act.primary {
      background: #38bdf8;
      color: #082f49;
    }
    button.act.primary:hover { background: #7dd3fc; }
    button.act.tema {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* KPI Ringkasan */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .kpi .k-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .kpi .k-val { font-size: 20px; font-weight: 800; margin-top: 4px; color: var(--text); }

    /* Kartu Divisi */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .card:hover { border-color: var(--primary); }
    .card.aktif { border-color: var(--primary); background: var(--primary-soft); }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Toolbar Tabel & Tabel */
    .table-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .table-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-mini {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-mini:hover { border-color: var(--primary); color: var(--primary); }
    .btn-mini.utama {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-mini.utama:hover { opacity: 0.92; color: #fff; }

    .box {
      background: var(--card);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: auto;
      max-height: 540px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 9px 11px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--th-bg);
      color: var(--th-text);
      z-index: 1;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: var(--row-hover); cursor: pointer; }

    .avatar {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      margin-right: 7px;
      vertical-align: middle;
    }
    .pill {
      display: inline-block;
      background: var(--pill-bg);
      color: var(--pill-text);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .pill-poin {
      display: inline-block;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .footer-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    #modal.aktif { display: flex; }
    .modal-isi {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 14px;
      max-width: 540px;
      width: 100%;
      max-height: 82vh;
      overflow: auto;
    }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .btn-dark {
      background: var(--primary);
      color: #fff;
      border: 0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sec {
      background: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .riwayat-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .wrap { flex-direction: column; }
      .side { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
      .main { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="side">
      <h3>BM KPDJP 2026</h3>

      <div class="side-label">Menu Utama</div>
      <button class="nav-btn aktif" id="tabPersonel" onclick="gantiTab('personel')">
        <span>Data Personel</span><span class="badge-jml" id="jmlTabPersonel">0</span>
      </button>
      <button class="nav-btn" id="tabPelanggaran" onclick="gantiTab('pelanggaran')">
        <span>Data Pelanggaran</span><span class="badge-jml" id="jmlTabPelanggaran">0</span>
      </button>
      <button class="nav-btn" id="tabKlasifikasi" onclick="gantiTab('klasifikasi')">
        <span>Klasifikasi Pelanggaran</span><span class="badge-jml" id="jmlTabKlasifikasi">0</span>
      </button>

      <div id="blokSidebarDivisi">
        <div class="side-label" style="margin-top:10px;">Filter Divisi</div>
        <button class="nav-btn aktif" id="btnSemua" onclick="pilihDivisi('')">
          <span>Semua Divisi</span><span class="badge-jml" id="jmlSemua">0</span>
        </button>
        <div id="menuDivisi" style="margin-top:4px;"></div>
      </div>
    </aside>

    <main class="main">
      <div class="hero">
        <div class="hero-top">
          <div>
            <h1 id="judulUtama">DATA PERSONEL BM KPDJP 2026</h1>
            <p id="infoStats">Memuat data...</p>
          </div>
          <span class="jam-pill" id="infoWaktuWIB">WIB: --:--:-- • Mode Otomatis</span>
        </div>
        <div class="bar">
          <input id="cari" type="text" placeholder="Cari nama, NIP, jabatan, divisi, atau kata kunci..." />
          <select id="filterDivisi"><option value="">Semua Divisi</option></select>
          <button class="act primary" id="btnRefresh" onclick="muat(true)">Refresh Data</button>
          <button class="act tema" id="btnTema" onclick="gantiModeTema()">Tema: Otomatis WIB</button>
        </div>
      </div>

      <div class="kpi-grid" id="kpiGrid">
        <div class="kpi">
          <div class="k-label" id="kpiLabel1">Data Cocok Filter</div>
          <div class="k-val" id="kpiVal1">0</div>
        </div>
        <div class="kpi">
          <div class="k-label" id="kpiLabel2">Laki - Laki</div>
          <div class="k-val" id="kpiVal2">0</div>
        </div>
        <div class="kpi">
          <div class="k-label" id="kpiLabel3">Perempuan</div>
          <div class="k-val" id="kpiVal3">0</div>
        </div>
        <div class="kpi">
          <div class="k-label" id="kpiLabel4">Jumlah Divisi</div>
          <div class="k-val" id="kpiVal4">0</div>
        </div>
      </div>

      <div class="cards" id="kartuDivisi"></div>

      <div class="table-top">
        <span style="font-weight:700; font-size:14px;" id="judulTabel">Daftar Personel</span>
        <div class="table-actions">
          <button class="btn-mini" onclick="unduhCSV()">Unduh CSV Hasil Filter</button>
        </div>
      </div>

      <div class="box">
        <table>
          <thead><tr id="kepalaTabel"></tr></thead>
          <tbody id="isiTabel"></tbody>
        </table>
      </div>

      <div class="footer-bar">
        <span id="infoBarisTabel">Baris tampil: 0</span>
        <div class="footer-nav" id="navigasiBawah">
          <button class="btn-mini utama" id="btnBawahTambah" onclick="muatLebihBanyak()">+50 Baris Lagi</button>
          <button class="btn-mini" id="btnBawahSemua" onclick="tampilkanSemuaBaris()">Tampilkan Semua</button>
          <button class="btn-mini" id="btnBawahRingkas" onclick="ringkasKeAwal()">Ringkas (50 Baris)</button>
        </div>
      </div>
    </main>
  </div>

  <div id="modal" onclick="if(event.target.id==='modal') tutupModal()">
    <div class="modal-isi">
      <h3 style="margin-top:0;" id="modalJudul">Detail Data</h3>
      <div id="detailIsi"></div>
      <div class="modal-actions">
        <button class="btn-sec" id="btnSalinNip" onclick="salinNilai('nip')">Salin NIP</button>
        <button class="btn-sec" id="btnSalinEmail" onclick="salinNilai('email')">Salin Email</button>
        <button class="btn-dark" onclick="tutupModal()">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const URL_DATA = "https://script.google.com/macros/s/AKfycbzKrn6vwNSM5hJGywoYmEXzKwA_rjFKeu9YRQq3lcNdYyO6Z0wIgNC2PYU1DmKNtm7l/exec";
    const CACHE_KEY = "cacheBmKpdjp2026_v3";
    const DURASI_CACHE_MS = 24 * 60 * 60 * 1000;

    const MAP_DIVISI_INGGRIS = {
      "manajemen office": "Management Office",
      "management office": "Management Office",
      "engineering": "Engineering",
      "engieering": "Engineering",
      "security": "Security",
      "housekeeping": "Housekeeping",
      "banquet": "Banquet",
      "sopir": "Driver",
      "driver": "Driver",
      "resepsionis": "Receptionist",
      "receptionist": "Receptionist"
    };

    const URUTAN_DIVISI = [
      "Management Office",
      "Engineering",
      "Security",
      "Housekeeping",
      "Banquet",
      "Driver",
      "Receptionist"
    ];

    const BATAS_AWAL = 50;
    let batasTampil = BATAS_AWAL;
    let timerKetik = null;
    let modeTema = localStorage.getItem("modeTemaKpdjp") || "auto";
    let tabAktif = "personel"; // 'personel' | 'pelanggaran' | 'klasifikasi'

    let dbPersonel = [];
    let dbPelanggaran = [];
    let dbKlasifikasi = [];
    let mapPelanggaranByNip = {};

    let dataIndeks = [];
    let hasilTerakhir = [];
    let barisDitampilkan = [];
    let kolomList = [];
    let dataModalAktif = null;

    function ambilJamWIB() {
      var bagian = new Intl.DateTimeFormat("id-ID", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(new Date());

      var jam = 0;
      var teksJam = "";
      bagian.forEach(function(p) {
        if (p.type === "hour") {
          jam = parseInt(p.value, 10);
          teksJam += p.value;
        } else if (p.type === "minute" || p.type === "second") {
          teksJam += ":" + p.value;
        }
      });

      var adalahMalam = (jam >= 18 || jam < 6);
      return { jam: jam, teksJam: teksJam, adalahMalam: adalahMalam };
    }

    function terapkanTema() {
      var info = ambilJamWIB();
      var pakaiGelap = modeTema === "dark" || (modeTema === "auto" && info.adalahMalam);
      document.body.classList.toggle("mode-malam", pakaiGelap);

      var labelMode = modeTema === "auto"
        ? (info.adalahMalam ? "Otomatis WIB (Malam)" : "Otomatis WIB (Siang)")
        : (modeTema === "dark" ? "Hitam" : "Terang");

      document.getElementById("infoWaktuWIB").textContent = "WIB: " + info.teksJam + " • " + labelMode;
      document.getElementById("btnTema").textContent = "Tema: " + (modeTema === "auto" ? "Otomatis WIB" : (modeTema === "dark" ? "Hitam" : "Terang"));
    }

    function gantiModeTema() {
      if (modeTema === "auto") modeTema = "dark";
      else if (modeTema === "dark") modeTema = "light";
      else modeTema = "auto";
      localStorage.setItem("modeTemaKpdjp", modeTema);
      terapkanTema();
    }

    terapkanTema();
    setInterval(terapkanTema, 1000);

    function formatDivisiInggris(rawDiv) {
      var bersih = String(rawDiv || "").trim();
      if (!bersih) return "";
      var kunci = bersih.toLowerCase();
      return MAP_DIVISI_INGGRIS[kunci] || bersih;
    }

    function getDiv(row) {
      return formatDivisiInggris(row.Divisi || row.DIvisi || row.divisi || "");
    }

    function getGender(row) {
      return String(row["Jenis Kelamin"] || row["jenis kelamin"] || "").trim().toLowerCase();
    }

    function getNip(row) {
      return String(row.NIP || row.nip || "").trim();
    }

    function getEmail(row) {
      return String(row["Alamat Email"] || row.Email || row.email || "").trim();
    }

    function urutDiv(arr) {
      return arr.slice().sort(function(a, b) {
        var ia = URUTAN_DIVISI.indexOf(a);
        var ib = URUTAN_DIVISI.indexOf(b);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a.localeCompare(b, "en");
      });
    }

    function inisial(teks) {
      var kata = String(teks || "PR").trim().split(/\s+/).filter(Boolean);
      if (!kata.length) return "PR";
      if (kata.length === 1) return kata[0].slice(0, 2).toUpperCase();
      return ((kata[0][0] || "") + (kata[1][0] || "")).toUpperCase();
    }

    function bangunPetaPelanggaran() {
      mapPelanggaranByNip = {};
      for (var i = 0; i < dbPelanggaran.length; i++) {
        var r = dbPelanggaran[i];
        var nip = getNip(r);
        if (!nip) continue;
        if (!mapPelanggaranByNip[nip]) mapPelanggaranByNip[nip] = [];
        mapPelanggaranByNip[nip].push(r);
      }
    }

    function setPayload(payload, labelTambahan) {
      if (Array.isArray(payload)) {
        dbPersonel = payload;
        dbPelanggaran = [];
        dbKlasifikasi = [];
      } else if (payload && typeof payload === "object") {
        dbPersonel = Array.isArray(payload.personel) ? payload.personel : [];
        dbPelanggaran = Array.isArray(payload.pelanggaran) ? payload.pelanggaran : [];
        dbKlasifikasi = Array.isArray(payload.klasifikasi) ? payload.klasifikasi : [];
      }

      document.getElementById("jmlTabPersonel").textContent = dbPersonel.length;
      document.getElementById("jmlTabPelanggaran").textContent = dbPelanggaran.length;
      document.getElementById("jmlTabKlasifikasi").textContent = dbKlasifikasi.length;

      bangunPetaPelanggaran();
      siapkanTabAktif(labelTambahan);
    }

    function gantiTab(tab) {
      tabAktif = tab;
      batasTampil = BATAS_AWAL;
      document.getElementById("cari").value = "";
      document.getElementById("filterDivisi").value = "";

      document.getElementById("tabPersonel").className = "nav-btn" + (tab === "personel" ? " aktif" : "");
      document.getElementById("tabPelanggaran").className = "nav-btn" + (tab === "pelanggaran" ? " aktif-merah" : "");
      document.getElementById("tabKlasifikasi").className = "nav-btn" + (tab === "klasifikasi" ? " aktif" : "");

      siapkanTabAktif("");
    }

    function siapkanTabAktif(labelTambahan) {
      var sumber = tabAktif === "personel" ? dbPersonel : (tabAktif === "pelanggaran" ? dbPelanggaran : dbKlasifikasi);
      var pakaiFilterDivisi = (tabAktif === "personel" || tabAktif === "pelanggaran");

      document.getElementById("blokSidebarDivisi").style.display = pakaiFilterDivisi ? "block" : "none";
      document.getElementById("filterDivisi").style.display = pakaiFilterDivisi ? "inline-block" : "none";
      document.getElementById("kartuDivisi").style.display = pakaiFilterDivisi ? "grid" : "none";

      if (tabAktif === "personel") {
        document.getElementById("judulUtama").textContent = "DATA PERSONEL BM KPDJP 2026";
        document.getElementById("judulTabel").textContent = "Daftar Personel";
        document.getElementById("cari").placeholder = "Cari nama, NIP, jabatan, divisi, atau kata kunci...";
      } else if (tabAktif === "pelanggaran") {
        document.getElementById("judulUtama").textContent = "DATA PELANGGARAN PERSONEL 2026";
        document.getElementById("judulTabel").textContent = "Daftar Personel Terkena Pelanggaran";
        document.getElementById("cari").placeholder = "Cari NIP, nama, jenis pelanggaran, atau keterangan SP...";
      } else {
        document.getElementById("judulUtama").textContent = "KLASIFIKASI & POIN PELANGGARAN";
        document.getElementById("judulTabel").textContent = "Tabel Klasifikasi Pelanggaran";
        document.getElementById("cari").placeholder = "Cari jenis pelanggaran, kategori, atau bobot poin...";
      }

      var setK = {};
      for (var i = 0; i < sumber.length; i++) {
        var r = sumber[i];
        if (r && typeof r === "object") {
          var keys = Object.keys(r);
          for (var j = 0; j < keys.length; j++) {
            setK[keys[j]] = 1;
          }
        }
      }
      kolomList = Object.keys(setK);
      document.getElementById("kepalaTabel").innerHTML = kolomList.map(function(k) { return "<th>" + k + "</th>"; }).join("");

      dataIndeks = sumber.map(function(r) {
        var divNorm = getDiv(r);
        var genderNorm = getGender(r);
        var isLaki = genderNorm.indexOf("laki") !== -1;
        var isPerempuan = !isLaki && genderNorm.indexOf("perempuan") !== -1;

        var gabungan = [divNorm];
        for (var k = 0; k < kolomList.length; k++) {
          var v = r[kolomList[k]];
          if (v !== undefined && v !== null && v !== "") {
            gabungan.push(String(v));
          }
        }

        return {
          raw: r,
          div: divNorm,
          isLaki: isLaki,
          isPerempuan: isPerempuan,
          teksCari: gabungan.join(" ").toLowerCase()
        };
      });

      if (pakaiFilterDivisi) {
        bangunDivisi();
      }
      tampil(labelTambahan);
    }

    function bacaCache() {
      try {
        var rawCache = localStorage.getItem(CACHE_KEY);
        if (!rawCache) return { ada: false, segar: false };
        var parsed = JSON.parse(rawCache);
        if (parsed && parsed.payload) {
          var umur = Date.now() - (parsed.ts || 0);
          var masihSegar = umur < DURASI_CACHE_MS;
          setPayload(parsed.payload, masihSegar ? "(dari cache)" : "(menyegarkan...)");
          return { ada: true, segar: masihSegar };
        }
      } catch (e) {}
      return { ada: false, segar: false };
    }

    async function muat(paksaSegar) {
      var btnRefresh = document.getElementById("btnRefresh");
      if (!paksaSegar) {
        var statusCache = bacaCache();
        if (statusCache.ada && statusCache.segar) {
          return;
        }
      } else {
        document.getElementById("infoStats").textContent = "Memuat data terbaru dari Google Sheets...";
      }

      if (btnRefresh) btnRefresh.disabled = true;

      var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timeoutId = controller ? setTimeout(function() { controller.abort(); }, 25000) : null;

      try {
        var url = URL_DATA + (paksaSegar ? "?refresh=1" : "");
        var res = await fetch(url, controller ? { signal: controller.signal } : {});
        if (timeoutId) clearTimeout(timeoutId);
        var json = await res.json();
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), payload: json }));
        } catch (e) {}
        setPayload(json, "(data terbaru)");
      } catch (e) {
        if (timeoutId) clearTimeout(timeoutId);
        if (!dbPersonel.length && !dbPelanggaran.length) {
          document.getElementById("infoStats").textContent = "Gagal memuat data: " + e.message;
        } else {
          tampil("(pakai cache)");
        }
      } finally {
        if (btnRefresh) btnRefresh.disabled = false;
      }
    }

    function bangunDivisi() {
      var hitung = {};
      for (var i = 0; i < dataIndeks.length; i++) {
        var d = dataIndeks[i].div;
        if (d) hitung[d] = (hitung[d] || 0) + 1;
      }
      var listDiv = urutDiv(Object.keys(hitung));
      var divAktif = document.getElementById("filterDivisi").value;

      document.getElementById("jmlSemua").textContent = dataIndeks.length;

      document.getElementById("filterDivisi").innerHTML = '<option value="">Semua Divisi</option>' +
        listDiv.map(function(d) { return '<option value="' + d + '">' + d + ' (' + hitung[d] + ')</option>'; }).join("");
      document.getElementById("filterDivisi").value = divAktif;

      document.getElementById("menuDivisi").innerHTML = listDiv.map(function(d) {
        var aktifClass = divAktif === d ? " aktif" : "";
        return '<button class="nav-btn' + aktifClass + '" data-d="' + d + '" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><span>' + d + '</span><span class="badge-jml">' + hitung[d] + '</span></button>';
      }).join("");

      var unit = tabAktif === "pelanggaran" ? "kasus" : "personel";
      document.getElementById("kartuDivisi").innerHTML = listDiv.map(function(d) {
        var aktifClass = divAktif === d ? " aktif" : "";
        return '<div class="card' + aktifClass + '" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><b>' + d + '</b><div class="card-sub">' + hitung[d] + ' ' + unit + '</div></div>';
      }).join("");
    }

    function pilihDivisi(d) {
      batasTampil = BATAS_AWAL;
      document.getElementById("filterDivisi").value = d;
      document.querySelectorAll("#blokSidebarDivisi .nav-btn").forEach(function(b) {
        b.classList.toggle("aktif", (d === "" && b.id === "btnSemua") || b.getAttribute("data-d") === d);
      });
      document.querySelectorAll("#kartuDivisi .card").forEach(function(c) {
        var judul = c.querySelector("b") ? c.querySelector("b").textContent.trim() : "";
        c.classList.toggle("aktif", Boolean(d) && judul === d);
      });
      tampil();
    }

    function muatLebihBanyak() {
      batasTampil += 50;
      tampil();
    }

    function tampilkanSemuaBaris() {
      batasTampil = hasilTerakhir.length || dataIndeks.length;
      tampil();
    }

    function ringkasKeAwal() {
      batasTampil = BATAS_AWAL;
      tampil();
    }

    function tutupModal() {
      document.getElementById("modal").classList.remove("aktif");
      dataModalAktif = null;
    }

    function salinNilai(jenis) {
      if (!dataModalAktif) return;
      var nilai = jenis === "nip" ? getNip(dataModalAktif) : getEmail(dataModalAktif);
      if (!nilai) {
        alert(jenis === "nip" ? "NIP kosong." : "Email kosong.");
        return;
      }
      navigator.clipboard.writeText(nilai).then(function() {
        alert((jenis === "nip" ? "NIP " : "Email ") + nilai + " berhasil disalin.");
      });
    }

    function formatSel(kolom, nilai, rowObj) {
      var kl = kolom.toLowerCase();
      if (kl === "divisi") {
        var divTampil = formatDivisiInggris(nilai);
        return divTampil ? '<span class="pill">' + divTampil + '</span>' : "";
      }
      var teks = String(nilai || "");
      if (kl.indexOf("nama") !== -1 && teks) {
        var lencana = "";
        if (tabAktif === "personel") {
          var nip = getNip(rowObj);
          var daftarP = nip ? mapPelanggaranByNip[nip] : null;
          if (daftarP && daftarP.length) {
            var catatan = daftarP.filter(function(x) { return x["Jenis Pelanggaran"] || x["Total Poin"] || x["Keterangan"]; });
            if (catatan.length) {
              var infoSingkat = catatan[catatan.length - 1]["Keterangan"] || (catatan[catatan.length - 1]["Total Poin"] + " Poin");
              lencana = '<span class="pill-poin">' + infoSingkat + '</span>';
            }
          }
        }
        return '<span class="avatar">' + inisial(teks) + '</span><span>' + teks + '</span>' + lencana;
      }
      if ((kl === "keterangan" || kl === "total poin") && teks && tabAktif === "pelanggaran") {
        return '<span class="pill-poin">' + teks + '</span>';
      }
      return teks;
    }

    function unduhCSV() {
      if (!hasilTerakhir.length) {
        alert("Tidak ada data untuk diunduh.");
        return;
      }
      var sep = ";";
      var barisCsv = [kolomList.map(function(k) { return '"' + String(k).replace(/"/g, '""') + '"'; }).join(sep)];
      hasilTerakhir.forEach(function(r) {
        var rowCsv = kolomList.map(function(k) {
          var val = k.toLowerCase() === "divisi" ? formatDivisiInggris(r[k]) : (r[k] || "");
          return '"' + String(val).replace(/[\r\n]+/g, " ").replace(/"/g, '""') + '"';
        }).join(sep);
        barisCsv.push(rowCsv);
      });
      var bom = "\uFEFF";
      var blob = new Blob([bom + barisCsv.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "data-" + tabAktif + "-bm-kpdjp-2026.csv";
      link.click();
    }

    function perbaruiKpi(saringRaw, jmlLaki, jmlPerempuan) {
      if (tabAktif === "personel") {
        document.getElementById("kpiLabel1").textContent = "Data Cocok Filter";
        document.getElementById("kpiVal1").textContent = saringRaw.length;
        document.getElementById("kpiLabel2").textContent = "Laki - Laki";
        document.getElementById("kpiVal2").textContent = jmlLaki;
        document.getElementById("kpiLabel3").textContent = "Perempuan";
        document.getElementById("kpiVal3").textContent = jmlPerempuan;
        document.getElementById("kpiLabel4").textContent = "Tercatat Pelanggaran";
        document.getElementById("kpiVal4").textContent = dbPelanggaran.length;
      } else if (tabAktif === "pelanggaran") {
        var totalPoin = 0;
        var jumlahSp = 0;
        for (var i = 0; i < saringRaw.length; i++) {
          var p = parseFloat(String(saringRaw[i]["Total Poin"] || saringRaw[i]["Poin Pelanggaran"] || "0").replace(",", "."));
          if (!isNaN(p)) totalPoin += p;
          if (String(saringRaw[i]["Keterangan"] || "").trim() !== "") jumlahSp++;
        }
        document.getElementById("kpiLabel1").textContent = "Baris Terfilter";
        document.getElementById("kpiVal1").textContent = saringRaw.length;
        document.getElementById("kpiLabel2").textContent = "Total Akumulasi Poin";
        document.getElementById("kpiVal2").textContent = totalPoin;
        document.getElementById("kpiLabel3").textContent = "Status SP / Sanksi";
        document.getElementById("kpiVal3").textContent = jumlahSp;
        document.getElementById("kpiLabel4").textContent = "Total Personel";
        document.getElementById("kpiVal4").textContent = dbPersonel.length;
      } else {
        document.getElementById("kpiLabel1").textContent = "Item Klasifikasi";
        document.getElementById("kpiVal1").textContent = saringRaw.length;
        document.getElementById("kpiLabel2").textContent = "Total Data Klasifikasi";
        document.getElementById("kpiVal2").textContent = dbKlasifikasi.length;
        document.getElementById("kpiLabel3").textContent = "Data Pelanggaran";
        document.getElementById("kpiVal3").textContent = dbPelanggaran.length;
        document.getElementById("kpiLabel4").textContent = "Total Personel";
        document.getElementById("kpiVal4").textContent = dbPersonel.length;
      }
    }

    function tampil(labelTambahan) {
      var kata = document.getElementById("cari").value.toLowerCase().trim();
      var div = document.getElementById("filterDivisi").value;
      var pakaiFilterDivisi = (tabAktif === "personel" || tabAktif === "pelanggaran");

      var saringRaw = [];
      var jmlLaki = 0;
      var jmlPerempuan = 0;

      for (var i = 0; i < dataIndeks.length; i++) {
        var item = dataIndeks[i];
        var okD = !pakaiFilterDivisi || !div || item.div === div;
        var okK = !kata || item.teksCari.indexOf(kata) !== -1;
        if (okD && okK) {
          saringRaw.push(item.raw);
          if (item.isLaki) jmlLaki++;
          else if (item.isPerempuan) jmlPerempuan++;
        }
      }

      hasilTerakhir = saringRaw;
      perbaruiKpi(saringRaw, jmlLaki, jmlPerempuan);

      var barisPotongan = saringRaw.slice(0, batasTampil);
      barisDitampilkan = barisPotongan;
      var suffix = labelTambahan ? " " + labelTambahan : "";

      document.getElementById("infoStats").textContent = "Menampilkan " + barisPotongan.length + " dari " + saringRaw.length + " data cocok (" + dataIndeks.length + " total baris)" + suffix;
      document.getElementById("infoBarisTabel").textContent = "Baris tampil: " + barisPotongan.length + " dari " + saringRaw.length;

      var lebihDari50 = saringRaw.length > BATAS_AWAL;
      var masihAda = barisPotongan.length < saringRaw.length;
      var sudahDiperluas = barisPotongan.length > BATAS_AWAL;

      document.getElementById("navigasiBawah").style.display = lebihDari50 ? "flex" : "none";
      document.getElementById("btnBawahTambah").style.display = masihAda ? "inline-block" : "none";
      document.getElementById("btnBawahSemua").style.display = masihAda ? "inline-block" : "none";
      document.getElementById("btnBawahRingkas").style.display = sudahDiperluas ? "inline-block" : "none";

      var htmlRows = "";
      for (var p = 0; p < barisPotongan.length; p++) {
        var r = barisPotongan[p];
        var cells = "";
        for (var c = 0; c < kolomList.length; c++) {
          var k = kolomList[c];
          cells += "<td>" + formatSel(k, r[k], r) + "</td>";
        }
        htmlRows += '<tr data-idx="' + p + '">' + cells + "</tr>";
      }

      document.getElementById("isiTabel").innerHTML = htmlRows;
    }

    document.getElementById("isiTabel").addEventListener("click", function(e) {
      var tr = e.target.closest("tr[data-idx]");
      if (!tr) return;
      var idx = parseInt(tr.getAttribute("data-idx"), 10);
      var r = barisDitampilkan[idx];
      if (!r) return;
      dataModalAktif = r;

      var nama = r["Nama Lengkap (Sesuai KTP)"] || r.Nama || r["Jenis Pelanggaran"] || "Detail Data";
      document.getElementById("modalJudul").textContent = nama;

      var htmlDetail = kolomList.map(function(k) {
        var valTampil = k.toLowerCase() === "divisi" ? formatDivisiInggris(r[k]) : r[k];
        return "<p style='margin:6px 0;'><b>" + k + ":</b> " + (valTampil || "-") + "</p>";
      }).join("");

      if (tabAktif === "personel") {
        var nip = getNip(r);
        var riwayat = nip ? mapPelanggaranByNip[nip] : null;
        if (riwayat && riwayat.length) {
          htmlDetail += "<div class='riwayat-box'><b>Catatan Pelanggaran (" + riwayat.length + "):</b><ul style='margin:6px 0 0; padding-left:18px;'>" +
            riwayat.map(function(x) {
              return "<li>" + (x["Tanggal Pelanggaran"] || "-") + " — " + (x["Jenis Pelanggaran"] || "Belum ada jenis") + " (Poin: " + (x["Total Poin"] || x["Poin Pelanggaran"] || "0") + ", Ket: " + (x["Keterangan"] || "-") + ")</li>";
            }).join("") + "</ul></div>";
        }
      }

      document.getElementById("detailIsi").innerHTML = htmlDetail;
      document.getElementById("modal").classList.add("aktif");
    });

    document.getElementById("cari").addEventListener("input", function() {
      batasTampil = BATAS_AWAL;
      clearTimeout(timerKetik);
      timerKetik = setTimeout(tampil, 120);
    });
    document.getElementById("filterDivisi").addEventListener("change", function(e) { pilihDivisi(e.target.value); });

    muat(false);
  </script>
</body>
</html>
