<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DATA PERSONEL BM KPDJP 2026</title>
  <style>
    :root {
      --sidebar: #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --row-alt: #fafcff;
      --row-hover: #eff6ff;
      --th-bg: #f8fafc;
      --th-text: #334155;
      --pill-bg: #f1f5f9;
      --pill-text: #334155;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --hero: linear-gradient(135deg, #0f172a 0%, #1d4ed8 58%, #4338ca 100%);
      --shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.08);
    }

    body.mode-malam {
      --sidebar: #05070c;
      --sidebar-hover: #111827;
      --sidebar-active: #1d4ed8;
      --bg: #07090f;
      --card: #101522;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
      --row-alt: #0d121d;
      --row-hover: #172554;
      --th-bg: #131a2b;
      --th-text: #e2e8f0;
      --pill-bg: #1e293b;
      --pill-text: #e2e8f0;
      --primary: #3b82f6;
      --primary-soft: #172554;
      --hero: linear-gradient(135deg, #05070c 0%, #111c3a 58%, #1e1b4b 100%);
      --shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .wrap { display: flex; min-height: 100vh; }

    /* Sidebar */
    .side {
      width: 248px;
      background: var(--sidebar);
      color: #fff;
      padding: 18px 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid var(--border);
    }
    .side h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.35;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .nav-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      color: #cbd5e1;
      border: 0;
      padding: 9px 11px;
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .nav-btn:hover { background: var(--sidebar-hover); color: #fff; }
    .nav-btn.aktif {
      background: var(--sidebar-active);
      color: #fff;
      font-weight: 600;
    }
    .badge-jml {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Main Content */
    .main { flex: 1; padding: 20px 22px 36px; min-width: 0; }

    .hero {
      background: var(--hero);
      color: #fff;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
    .hero p { margin: 0 0 14px; font-size: 13px; color: #dbeafe; }

    .jam-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f8fafc;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, button.act {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      font-size: 13px;
    }
    input {
      flex: 1;
      min-width: 210px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }
    select {
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    button.act {
      background: #e2e8f0;
      color: #0f172a;
      border-color: transparent;
      font-weight: 700;
      cursor: pointer;
    }
    button.act:hover { background: #cbd5e1; }
    button.act.primary {
      background: #38bdf8;
      color: #082f49;
    }
    button.act.primary:hover { background: #7dd3fc; }
    button.act.tema {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* KPI Ringkasan */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .kpi .k-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .kpi .k-val { font-size: 20px; font-weight: 800; margin-top: 4px; color: var(--text); }

    /* Kartu Divisi */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .card:hover { border-color: var(--primary); }
    .card.aktif { border-color: var(--primary); background: var(--primary-soft); }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Toolbar Tabel & Tabel */
    .table-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .table-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-mini {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-mini:hover { border-color: var(--primary); color: var(--primary); }

    .box {
      background: var(--card);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: auto;
      max-height: 540px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 9px 11px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--th-bg);
      color: var(--th-text);
      z-index: 1;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: var(--row-hover); cursor: pointer; }

    .avatar {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      margin-right: 7px;
      vertical-align: middle;
    }
    .pill {
      display: inline-block;
      background: var(--pill-bg);
      color: var(--pill-text);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    #modal.aktif { display: flex; }
    .modal-isi {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      max-height: 82vh;
      overflow: auto;
    }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .btn-dark {
      background: var(--primary);
      color: #fff;
      border: 0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sec {
      background: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .wrap { flex-direction: column; }
      .side { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
      .main { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="side">
      <h3>DATA PERSONEL BM KPDJP 2026</h3>
      <button class="nav-btn aktif" id="btnSemua" onclick="pilihDivisi('')">
        <span>Semua Data</span><span class="badge-jml" id="jmlSemua">0</span>
      </button>
      <div id="menuDivisi" style="margin-top:6px;"></div>
    </aside>

    <main class="main">
      <div class="hero">
        <div class="hero-top">
          <div>
            <h1>DATA PERSONEL BM KPDJP 2026</h1>
            <p id="infoStats">Memuat data...</p>
          </div>
          <span class="jam-pill" id="infoWaktuWIB">WIB: --:--:-- • Mode Otomatis</span>
        </div>
        <div class="bar">
          <input id="cari" type="text" placeholder="Cari nama, NIP, jabatan, divisi, atau kata kunci..." />
          <select id="filterDivisi"><option value="">Semua Divisi</option></select>
          <button class="act primary" onclick="muat(true)">Refresh Data</button>
          <button class="act tema" id="btnTema" onclick="gantiModeTema()">Tema: Otomatis WIB</button>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="k-label">Data Cocok Filter</div>
          <div class="k-val" id="kpiTampil">0</div>
        </div>
        <div class="kpi">
          <div class="k-label">Laki - Laki</div>
          <div class="k-val" id="kpiLaki">0</div>
        </div>
        <div class="kpi">
          <div class="k-label">Perempuan</div>
          <div class="k-val" id="kpiPerempuan">0</div>
        </div>
        <div class="kpi">
          <div class="k-label">Jumlah Divisi</div>
          <div class="k-val" id="kpiDivisi">0</div>
        </div>
      </div>

      <div class="cards" id="kartuDivisi"></div>

      <div class="table-top">
        <span style="font-weight:700; font-size:14px;">Daftar Personel</span>
        <div class="table-actions">
          <button class="btn-mini" id="btnMuatLagi" onclick="muatLebihBanyak()">Tampilkan +50 Baris</button>
          <button class="btn-mini" id="btnTampilSemua" onclick="tampilkanSemuaBaris()">Tampilkan Semua</button>
          <button class="btn-mini" onclick="unduhCSV()">Unduh CSV Hasil Filter</button>
        </div>
      </div>

      <div class="box">
        <table>
          <thead><tr id="kepalaTabel"></tr></thead>
          <tbody id="isiTabel"></tbody>
        </table>
      </div>

      <div class="footer-bar">
        <span id="infoBarisTabel">Baris tampil: 0</span>
        <span>Data tersimpan lokal 24 jam agar buka cepat. Klik Refresh Data untuk tarik terbaru.</span>
      </div>
    </main>
  </div>

  <div id="modal" onclick="if(event.target.id==='modal') tutupModal()">
    <div class="modal-isi">
      <h3 style="margin-top:0;" id="modalJudul">Detail Personel</h3>
      <div id="detailIsi"></div>
      <div class="modal-actions">
        <button class="btn-sec" id="btnSalinNip" onclick="salinNilai('nip')">Salin NIP</button>
        <button class="btn-sec" id="btnSalinEmail" onclick="salinNilai('email')">Salin Email</button>
        <button class="btn-dark" onclick="tutupModal()">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const URL_DATA = "https://script.google.com/macros/s/AKfycbzKrn6vwNSM5hJGywoYmEXzKwA_rjFKeu9YRQq3lcNdYyO6Z0wIgNC2PYU1DmKNtm7l/exec";
    const CACHE_KEY = "cachePersonelKpdjp2026_cepat";
    const DURASI_CACHE_MS = 24 * 60 * 60 * 1000;
    const ABAIKAN = ["data karyawan november 2026", "data personel november 2026", "data personil november 2026"];

    const MAP_DIVISI_INGGRIS = {
      "manajemen office": "Management Office",
      "management office": "Management Office",
      "engineering": "Engineering",
      "engieering": "Engineering",
      "security": "Security",
      "housekeeping": "Housekeeping",
      "banquet": "Banquet",
      "sopir": "Driver",
      "driver": "Driver",
      "resepsionis": "Receptionist",
      "receptionist": "Receptionist"
    };

    const URUTAN_DIVISI = [
      "Management Office",
      "Engineering",
      "Security",
      "Housekeeping",
      "Banquet",
      "Driver",
      "Receptionist"
    ];

    const BATAS_AWAL = 50;
    let batasTampil = BATAS_AWAL;
    let timerKetik = null;
    let modeTema = localStorage.getItem("modeTemaKpdjp") || "auto";

    function ambilJamWIB() {
      var bagian = new Intl.DateTimeFormat("id-ID", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(new Date());

      var jam = 0;
      var teksJam = "";
      bagian.forEach(function(p) {
        if (p.type === "hour") {
          jam = parseInt(p.value, 10);
          teksJam += p.value;
        } else if (p.type === "minute" || p.type === "second") {
          teksJam += ":" + p.value;
        }
      });

      var adalahMalam = (jam >= 18 || jam < 6);
      return { jam: jam, teksJam: teksJam, adalahMalam: adalahMalam };
    }

    function terapkanTema() {
      var info = ambilJamWIB();
      var pakaiGelap = modeTema === "dark" || (modeTema === "auto" && info.adalahMalam);
      document.body.classList.toggle("mode-malam", pakaiGelap);

      var labelMode = modeTema === "auto"
        ? (info.adalahMalam ? "Otomatis WIB (Malam)" : "Otomatis WIB (Siang)")
        : (modeTema === "dark" ? "Hitam" : "Terang");

      document.getElementById("infoWaktuWIB").textContent = "WIB: " + info.teksJam + " • " + labelMode;
      document.getElementById("btnTema").textContent = "Tema: " + (modeTema === "auto" ? "Otomatis WIB" : (modeTema === "dark" ? "Hitam" : "Terang"));
    }

    function gantiModeTema() {
      if (modeTema === "auto") modeTema = "dark";
      else if (modeTema === "dark") modeTema = "light";
      else modeTema = "auto";
      localStorage.setItem("modeTemaKpdjp", modeTema);
      terapkanTema();
    }

    terapkanTema();
    setInterval(terapkanTema, 1000);

    let semuaData = [];
    let hasilTerakhir = [];
    let kolomList = [];
    let dataModalAktif = null;

    function formatDivisiInggris(rawDiv) {
      var bersih = String(rawDiv || "").trim();
      if (!bersih) return "";
      var kunci = bersih.toLowerCase();
      return MAP_DIVISI_INGGRIS[kunci] || bersih;
    }

    function getDivAsli(row) {
      return String(row.Divisi || row.DIvisi || row.divisi || "").trim();
    }

    function getDiv(row) {
      return formatDivisiInggris(getDivAsli(row));
    }

    function getGender(row) {
      return String(row["Jenis Kelamin"] || row["jenis kelamin"] || "").trim().toLowerCase();
    }

    function getNip(row) {
      return String(row.NIP || row.nip || "").trim();
    }

    function getEmail(row) {
      return String(row["Alamat Email"] || row.Email || row.email || "").trim();
    }

    function diabaikan(nama) {
      var k = String(nama || "").trim().toLowerCase();
      return ABAIKAN.indexOf(k) !== -1 || k.indexOf("november 2026") !== -1;
    }

    function urutDiv(arr) {
      return arr.slice().sort(function(a, b) {
        var ia = URUTAN_DIVISI.indexOf(a);
        var ib = URUTAN_DIVISI.indexOf(b);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a.localeCompare(b, "en");
      });
    }

    function inisial(teks) {
      var kata = String(teks || "PR").trim().split(/\s+/).filter(Boolean);
      if (!kata.length) return "PR";
      if (kata.length === 1) return kata[0].slice(0, 2).toUpperCase();
      return ((kata[0][0] || "") + (kata[1][0] || "")).toUpperCase();
    }

    function prosesDataArray(raw, labelTambahan) {
      semuaData = raw.filter(function(r) {
        return !diabaikan(getDivAsli(r)) && !diabaikan(getDiv(r));
      });

      var setK = {};
      for (var i = 0; i < semuaData.length; i++) {
        var r = semuaData[i];
        if (r && typeof r === "object") {
          var keys = Object.keys(r);
          for (var j = 0; j < keys.length; j++) {
            setK[keys[j]] = 1;
          }
        }
      }
      kolomList = Object.keys(setK);
      document.getElementById("kepalaTabel").innerHTML = kolomList.map(function(k) { return "<th>" + k + "</th>"; }).join("");

      bangunDivisi();
      tampil(labelTambahan);
    }

    function bacaCache() {
      try {
        var rawCache = localStorage.getItem(CACHE_KEY);
        if (!rawCache) return { ada: false, segar: false };
        var parsed = JSON.parse(rawCache);
        if (parsed && Array.isArray(parsed.data) && parsed.data.length) {
          var umur = Date.now() - (parsed.ts || 0);
          var masihSegar = umur < DURASI_CACHE_MS;
          prosesDataArray(parsed.data, masihSegar ? "(dari cache)" : "(menyegarkan...)");
          return { ada: true, segar: masihSegar };
        }
      } catch (e) {}
      return { ada: false, segar: false };
    }

    async function muat(paksaSegar) {
      var statusCache = { ada: false, segar: false };
      if (!paksaSegar) {
        statusCache = bacaCache();
        if (statusCache.ada && statusCache.segar) {
          return;
        }
      } else {
        document.getElementById("infoStats").textContent = "Memuat data personel terbaru...";
      }

      try {
        var res = await fetch(URL_DATA);
        var json = await res.json();
        var raw = Array.isArray(json) ? json : (Array.isArray(json && json.data) ? json.data : []);
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: raw }));
        } catch (e) {}
        prosesDataArray(raw, "(data terbaru)");
      } catch (e) {
        if (!semuaData.length) {
          document.getElementById("infoStats").textContent = "Gagal memuat data: " + e.message;
        } else {
          tampil("(pakai cache)");
        }
      }
    }

    function bangunDivisi() {
      var hitung = {};
      for (var i = 0; i < semuaData.length; i++) {
        var d = getDiv(semuaData[i]);
        if (d && !diabaikan(d)) hitung[d] = (hitung[d] || 0) + 1;
      }
      var listDiv = urutDiv(Object.keys(hitung));
      var divAktif = document.getElementById("filterDivisi").value;

      document.getElementById("jmlSemua").textContent = semuaData.length;
      document.getElementById("kpiDivisi").textContent = listDiv.length;

      document.getElementById("filterDivisi").innerHTML = '<option value="">Semua Divisi</option>' +
        listDiv.map(function(d) { return '<option value="' + d + '">' + d + ' (' + hitung[d] + ')</option>'; }).join("");
      document.getElementById("filterDivisi").value = divAktif;

      document.getElementById("menuDivisi").innerHTML = listDiv.map(function(d) {
        var aktifClass = divAktif === d ? " aktif" : "";
        return '<button class="nav-btn' + aktifClass + '" data-d="' + d + '" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><span>' + d + '</span><span class="badge-jml">' + hitung[d] + '</span></button>';
      }).join("");

      document.getElementById("kartuDivisi").innerHTML = listDiv.map(function(d) {
        var aktifClass = divAktif === d ? " aktif" : "";
        return '<div class="card' + aktifClass + '" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><b>' + d + '</b><div class="card-sub">' + hitung[d] + ' personel</div></div>';
      }).join("");
    }

    function pilihDivisi(d) {
      batasTampil = BATAS_AWAL;
      document.getElementById("filterDivisi").value = d;
      document.querySelectorAll(".nav-btn").forEach(function(b) {
        b.classList.toggle("aktif", (d === "" && b.id === "btnSemua") || b.getAttribute("data-d") === d);
      });
      document.querySelectorAll("#kartuDivisi .card").forEach(function(c) {
        var judul = c.querySelector("b") ? c.querySelector("b").textContent.trim() : "";
        c.classList.toggle("aktif", Boolean(d) && judul === d);
      });
      tampil();
    }

    function muatLebihBanyak() {
      batasTampil += 50;
      tampil();
    }

    function tampilkanSemuaBaris() {
      batasTampil = hasilTerakhir.length || semuaData.length;
      tampil();
    }

    function tutupModal() {
      document.getElementById("modal").classList.remove("aktif");
      dataModalAktif = null;
    }

    function salinNilai(jenis) {
      if (!dataModalAktif) return;
      var nilai = jenis === "nip" ? getNip(dataModalAktif) : getEmail(dataModalAktif);
      if (!nilai) {
        alert(jenis === "nip" ? "NIP kosong." : "Email kosong.");
        return;
      }
      navigator.clipboard.writeText(nilai).then(function() {
        alert((jenis === "nip" ? "NIP " : "Email ") + nilai + " berhasil disalin.");
      });
    }

    function formatSel(kolom, nilai) {
      var kl = kolom.toLowerCase();
      if (kl === "divisi") {
        var divTampil = formatDivisiInggris(nilai);
        return divTampil ? '<span class="pill">' + divTampil + '</span>' : "";
      }
      var teks = String(nilai || "");
      if (kl.indexOf("nama") !== -1 && teks) {
        return '<span class="avatar">' + inisial(teks) + '</span><span>' + teks + '</span>';
      }
      return teks;
    }

    function unduhCSV() {
      if (!hasilTerakhir.length) {
        alert("Tidak ada data personel untuk diunduh.");
        return;
      }
      var barisCsv = [kolomList.map(function(k) { return '"' + String(k).replace(/"/g, '""') + '"'; }).join(",")];
      hasilTerakhir.forEach(function(r) {
        var rowCsv = kolomList.map(function(k) {
          var val = k.toLowerCase() === "divisi" ? formatDivisiInggris(r[k]) : (r[k] || "");
          return '"' + String(val).replace(/"/g, '""') + '"';
        }).join(",");
        barisCsv.push(rowCsv);
      });
      var blob = new Blob([barisCsv.join("\n")], { type: "text/csv;charset=utf-8;" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "data-personel-bm-kpdjp-2026.csv";
      link.click();
    }

    function tampil(labelTambahan) {
      var kata = document.getElementById("cari").value.toLowerCase().trim();
      var div = document.getElementById("filterDivisi").value;

      var saring = semuaData.filter(function(r) {
        var okD = !div || getDiv(r) === div;
        var okK = !kata || Object.values(r).some(function(v) { return String(v || "").toLowerCase().indexOf(kata) !== -1; });
        return okD && okK;
      });
      hasilTerakhir = saring;

      var jmlLaki = 0;
      var jmlPerempuan = 0;
      for (var i = 0; i < saring.length; i++) {
        var g = getGender(saring[i]);
        if (g.indexOf("laki") !== -1) jmlLaki++;
        else if (g.indexOf("perempuan") !== -1) jmlPerempuan++;
      }

      var barisPotongan = saring.slice(0, batasTampil);
      var suffix = labelTambahan ? " " + labelTambahan : "";

      document.getElementById("infoStats").textContent = "Menampilkan " + barisPotongan.length + " dari " + saring.length + " data cocok (" + semuaData.length + " total personel)" + suffix;
      document.getElementById("kpiTampil").textContent = saring.length;
      document.getElementById("kpiLaki").textContent = jmlLaki;
      document.getElementById("kpiPerempuan").textContent = jmlPerempuan;
      document.getElementById("infoBarisTabel").textContent = "Baris tampil: " + barisPotongan.length + " dari " + saring.length;

      var btnLebih = document.getElementById("btnMuatLagi");
      var btnSemuaBaris = document.getElementById("btnTampilSemua");
      var masihAda = barisPotongan.length < saring.length;
      btnLebih.style.display = masihAda ? "inline-block" : "none";
      btnSemuaBaris.style.display = masihAda ? "inline-block" : "none";

      var fragment = document.createDocumentFragment();
      for (var p = 0; p < barisPotongan.length; p++) {
        (function(r) {
          var tr = document.createElement("tr");
          tr.innerHTML = kolomList.map(function(k) { return "<td>" + formatSel(k, r[k]) + "</td>"; }).join("");
          tr.onclick = function() {
            dataModalAktif = r;
            var nama = r["Nama Lengkap (Sesuai KTP)"] || r.Nama || "Detail Personel";
            document.getElementById("modalJudul").textContent = nama;
            document.getElementById("detailIsi").innerHTML = kolomList.map(function(k) {
              var valTampil = k.toLowerCase() === "divisi" ? formatDivisiInggris(r[k]) : r[k];
              return "<p style='margin:6px 0;'><b>" + k + ":</b> " + (valTampil || "-") + "</p>";
            }).join("");
            document.getElementById("modal").classList.add("aktif");
          };
          fragment.appendChild(tr);
        })(barisPotongan[p]);
      }

      var tbody = document.getElementById("isiTabel");
      tbody.innerHTML = "";
      tbody.appendChild(fragment);
    }

    document.getElementById("cari").addEventListener("input", function() {
      batasTampil = BATAS_AWAL;
      clearTimeout(timerKetik);
      timerKetik = setTimeout(tampil, 120);
    });
    document.getElementById("filterDivisi").addEventListener("change", function(e) { pilihDivisi(e.target.value); });

    muat(false);
  </script>
</body>
</html>
