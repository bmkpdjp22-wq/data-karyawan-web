<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direktori Pegawai</title>
  <style>
    :root {
      --sidebar: #0f172a;
      --sidebar-2: #1e293b;
      --sidebar-active: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -6px rgba(15, 23, 42, 0.05);
      --hero-bg: linear-gradient(135deg, #0f172a 0%, #1d4ed8 55%, #4f46e5 100%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 264px;
      background: var(--sidebar);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 18px 14px;
      gap: 16px;
      transition: transform 0.2s ease, width 0.2s ease;
    }
    .sidebar.tertutup {
      display: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #3b82f6, #818cf8);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }
    .brand-title { font-weight: 700; font-size: 15px; line-height: 1.25; }
    .brand-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    .nav-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #64748b;
      padding: 0 10px 6px;
    }
    .nav-btn {
      width: 100%;
      background: transparent;
      color: #cbd5e1;
      border: none;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-btn:hover { background: var(--sidebar-2); color: #fff; }
    .nav-btn.aktif {
      background: var(--sidebar-active);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .badge {
      background: rgba(255, 255, 255, 0.14);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Main Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    .btn-menu {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .topbar-search {
      width: 300px;
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 13px;
      background: #f8fafc;
      outline: none;
    }
    .topbar-search:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .content {
      padding: 22px 24px 40px;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
    }

    /* Hero */
    .hero {
      background: var(--hero-bg);
      color: #fff;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .hero p {
      margin: 0 auto 20px;
      max-width: 560px;
      color: #dbeafe;
      font-size: 14px;
    }

    .search-box {
      max-width: 740px;
      margin: 0 auto 14px;
      display: flex;
      gap: 8px;
      background: #fff;
      padding: 7px;
      border-radius: 14px;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
      flex-wrap: wrap;
    }
    .search-box input {
      flex: 1;
      min-width: 210px;
      border: none;
      outline: none;
      padding: 9px 12px;
      font-size: 14px;
      color: var(--text);
      background: transparent;
    }
    .search-box select {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      background: #f8fafc;
      color: var(--text);
      cursor: pointer;
    }
    .btn-reset {
      border: none;
      background: #e2e8f0;
      color: #1e293b;
      padding: 0 14px;
      min-height: 38px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-reset:hover { background: #cbd5e1; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      margin-bottom: 18px;
      color: #e0e7ff;
    }
    .chip {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s ease;
    }
    .chip:hover { background: rgba(255, 255, 255, 0.26); }

    .stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #e2e8f0;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    .stats b { color: #fff; font-size: 15px; }

    /* Section Header */
    .section-title {
      margin: 24px 0 12px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Quick Cards */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 12px;
    }
    .quick-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .quick-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .quick-card.aktif {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .quick-card .q-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--text);
    }
    .quick-card .q-sub { font-size: 12px; color: var(--muted); }

    /* Table Card */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .table-wrap { overflow-x: auto; max-height: 540px; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      border-bottom: 1px solid #eef2f6;
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: #334155;
      font-weight: 700;
      z-index: 2;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:nth-child(even) { background: #fafcff; }
    tbody tr:hover { background: var(--primary-soft); cursor: pointer; }

    .avatar {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 11px;
      margin-right: 8px;
      vertical-align: middle;
    }
    .pill-div {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(3px);
      align-items: center;
