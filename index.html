<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direktori Pegawai</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #0f172a; }
    .wrap { display: flex; min-height: 100vh; }
    .side { width: 240px; background: #0f172a; color: #fff; padding: 16px; flex-shrink: 0; }
    .side h3 { margin: 0 0 12px; font-size: 16px; }
    .nav-btn { display: flex; justify-content: space-between; width: 100%; background: transparent; color: #cbd5e1; border: 0; padding: 9px 10px; border-radius: 8px; text-align: left; cursor: pointer; margin-bottom: 4px; font-size: 13px; }
    .nav-btn:hover, .nav-btn.aktif { background: #2563eb; color: #fff; }
    .main { flex: 1; padding: 20px; min-width: 0; }
    .hero { background: linear-gradient(135deg, #0f172a, #2563eb); color: #fff; padding: 24px; border-radius: 14px; margin-bottom: 18px; }
    .hero h1 { margin: 0 0 6px; font-size: 24px; }
    .hero p { margin: 0 0 14px; font-size: 13px; opacity: 0.9; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, button.act { padding: 9px 12px; border-radius: 8px; border: 0; font-size: 13px; }
    input { flex: 1; min-width: 200px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .card { background: #fff; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; cursor: pointer; }
    .card:hover { border-color: #2563eb; }
    .box { background: #fff; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 8px 10px; text-align: left; white-space: nowrap; }
    th { background: #f8fafc; }
    tr:hover { background: #eff6ff; cursor: pointer; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 16px; }
    #modal.aktif { display: flex; }
    .modal-isi { background: #fff; padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; max-height: 80vh; overflow: auto; }
    @media (max-width: 768px) { .wrap { flex-direction: column; } .side { width: 100%; } }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="side">
      <h3>Direktori Pegawai</h3>
      <button class="nav-btn aktif" id="btnSemua" onclick="pilihDivisi('')">
        <span>Semua Data</span><span id="jmlSemua">0</span>
      </button>
      <div id="menuDivisi" style="margin-top:10px;"></div>
    </aside>

    <main class="main">
      <div class="hero">
        <h1>Cari Data Karyawan</h1>
        <p id="infoStats">Memuat data...</p>
        <div class="bar">
          <input id="cari" type="text" placeholder="Cari nama, NIP, jabatan, atau kata kunci..." />
          <select id="filterDivisi"><option value="">Semua Divisi</option></select>
          <button class="act" onclick="resetSemua()">Reset</button>
        </div>
      </div>

      <div class="cards" id="kartuDivisi"></div>

      <div class="box">
        <table>
          <thead><tr id="kepalaTabel"></tr></thead>
          <tbody id="isiTabel"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal" onclick="if(event.target.id==='modal') tutupModal()">
    <div class="modal-isi">
      <h3 style="margin-top:0;">Detail Karyawan</h3>
      <div id="detailIsi"></div>
      <br />
      <button onclick="tutupModal()">Tutup</button>
    </div>
  </div>

  <script>
    const URL_DATA = "https://script.google.com/macros/s/AKfycbzKrn6vwNSM5hJGywoYmEXzKwA_rjFKeu9YRQq3lcNdYyO6Z0wIgNC2PYU1DmKNtm7l/exec";
    const ABAIKAN = ["data karyawan november 2026"];
    const URUTAN = ["manajemen office", "engineering", "engieering", "security", "housekeeping", "banquet", "sopir", "resepsionis"];

    let semuaData = [];
    let kolomList = [];

    function getDiv(row) {
      return String(row.Divisi || row.DIvisi || row.divisi || "").trim();
    }

    function diabaikan(nama) {
      return ABAIKAN.indexOf(String(nama || "").trim().toLowerCase()) !== -1;
    }

    function urutDiv(arr) {
      return arr.slice().sort(function(a, b) {
        var ia = URUTAN.indexOf(a.toLowerCase());
        var ib = URUTAN.indexOf(b.toLowerCase());
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a.localeCompare(b);
      });
    }

    async function muat() {
      try {
        var res = await fetch(URL_DATA);
        var json = await res.json();
        var raw = Array.isArray(json) ? json : (Array.isArray(json && json.data) ? json.data : []);
        semuaData = raw.filter(function(r) { return !diabaikan(getDiv(r)); });

        var setK = {};
        semuaData.forEach(function(r) {
          Object.keys(r || {}).forEach(function(k) { setK[k] = 1; });
        });
        kolomList = Object.keys(setK);
        document.getElementById("kepalaTabel").innerHTML = kolomList.map(function(k) { return "<th>" + k + "</th>"; }).join("");

        bangunDivisi();
        tampil();
      } catch (e) {
        document.getElementById("infoStats").textContent = "Error: " + e.message;
      }
    }

    function bangunDivisi() {
      var hitung = {};
      semuaData.forEach(function(r) {
        var d = getDiv(r);
        if (d && !diabaikan(d)) hitung[d] = (hitung[d] || 0) + 1;
      });
      var listDiv = urutDiv(Object.keys(hitung));

      document.getElementById("jmlSemua").textContent = semuaData.length;
      document.getElementById("filterDivisi").innerHTML = '<option value="">Semua Divisi</option>' +
        listDiv.map(function(d) { return '<option value="' + d + '">' + d + ' (' + hitung[d] + ')</option>'; }).join("");

      document.getElementById("menuDivisi").innerHTML = listDiv.map(function(d) {
        return '<button class="nav-btn" data-d="' + d + '" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><span>' + d + '</span><span>' + hitung[d] + '</span></button>';
      }).join("");

      document.getElementById("kartuDivisi").innerHTML = listDiv.map(function(d) {
        return '<div class="card" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><b>' + d + '</b><div style="font-size:12px;color:#64748b;margin-top:4px;">' + hitung[d] + ' pegawai</div></div>';
      }).join("");
    }

    function pilihDivisi(d) {
      document.getElementById("filterDivisi").value = d;
      document.querySelectorAll(".nav-btn").forEach(function(b) {
        b.classList.toggle("aktif", (d === "" && b.id === "btnSemua") || b.getAttribute("data-d") === d);
      });
      tampil();
    }

    function resetSemua() {
      document.getElementById("cari").value = "";
      pilihDivisi("");
    }

    function tutupModal() {
      document.getElementById("modal").classList.remove("aktif");
    }

    function tampil() {
      var kata = document.getElementById("cari").value.toLowerCase().trim();
      var div = document.getElementById("filterDivisi").value;

      var saring = semuaData.filter(function(r) {
        var okD = !div || getDiv(r) === div;
        var okK = !kata || Object.values(r).some(function(v) { return String(v || "").toLowerCase().indexOf(kata) !== -1; });
        return okD && okK;
      });

      document.getElementById("infoStats").textContent = "Menampilkan " + saring.length + " dari " + semuaData.length + " data";

      var tbody = document.getElementById("isiTabel");
      tbody.innerHTML = "";
      saring.forEach(function(r) {
        var tr = document.createElement("tr");
        tr.innerHTML = kolomList.map(function(k) { return "<td>" + (r[k] || "") + "</td>"; }).join("");
        tr.onclick = function() {
          document.getElementById("detailIsi").innerHTML = kolomList.map(function(k) {
            return "<p><b>" + k + ":</b> " + (r[k] || "-") + "</p>";
          }).join("");
          document.getElementById("modal").classList.add("aktif");
        };
        tbody.appendChild(tr);
      });
    }

    document.getElementById("cari").addEventListener("input", tampil);
    document.getElementById("filterDivisi").addEventListener("change", function(e) { pilihDivisi(e.target.value); });

    muat();
  </script>
</body>
</html>
