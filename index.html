<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DATA KARYAWAN BM KPDJP 2026</title>
  <style>
    :root {
      --sidebar: #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --hero: linear-gradient(135deg, #0f172a 0%, #1d4ed8 58%, #4338ca 100%);
      --shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap { display: flex; min-height: 100vh; }

    /* Sidebar */
    .side {
      width: 248px;
      background: var(--sidebar);
      color: #fff;
      padding: 18px 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .side h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.35;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .nav-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      color: #cbd5e1;
      border: 0;
      padding: 9px 11px;
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 13px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-btn:hover { background: var(--sidebar-hover); color: #fff; }
    .nav-btn.aktif {
      background: var(--sidebar-active);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .badge-jml {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Main Content */
    .main { flex: 1; padding: 20px 22px 36px; min-width: 0; }

    .hero {
      background: var(--hero);
      color: #fff;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .hero h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
    .hero p { margin: 0 0 14px; font-size: 13px; color: #dbeafe; }

    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, button.act {
      padding: 9px 12px;
      border-radius: 9px;
      border: 0;
      font-size: 13px;
    }
    input {
      flex: 1;
      min-width: 210px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    select {
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }
    button.act {
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }
    button.act:hover { background: #cbd5e1; }
    button.act.primary {
      background: #38bdf8;
      color: #082f49;
    }
    button.act.primary:hover { background: #7dd3fc; }

    /* KPI Ringkasan */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .kpi .k-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .kpi .k-val { font-size: 20px; font-weight: 800; margin-top: 4px; color: var(--text); }

    /* Kartu Divisi */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .card.aktif { border-color: var(--primary); background: var(--primary-soft); }

    /* Toolbar Tabel & Tabel */
    .table-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .btn-mini {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-mini:hover { border-color: var(--primary); color: var(--primary); }

    .box {
      background: var(--card);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: auto;
      max-height: 540px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      border-bottom: 1px solid #eef2f6;
      padding: 9px 11px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: #334155;
      z-index: 1;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:nth-child(even) { background: #fafcff; }
    tbody tr:hover { background: var(--primary-soft); cursor: pointer; }

    .avatar {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      margin-right: 7px;
      vertical-align: middle;
    }
    .pill {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    #modal.aktif { display: flex; }
    .modal-isi {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      max-height: 82vh;
      overflow: auto;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
    }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .btn-dark {
      background: var(--sidebar);
      color: #fff;
      border: 0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sec {
      background: #e2e8f0;
      color: var(--text);
      border: 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .wrap { flex-direction: column; }
      .side { width: 100%; }
      .main { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="side">
      <h3>DATA KARYAWAN BM KPDJP 2026</h3>
      <button class="nav-btn aktif" id="btnSemua" onclick="pilihDivisi('')">
        <span>Semua Data</span><span class="badge-jml" id="jmlSemua">0</span>
      </button>
      <div id="menuDivisi" style="margin-top:6px;"></div>
    </aside>

    <main class="main">
      <div class="hero">
        <h1>DATA KARYAWAN BM KPDJP 2026</h1>
        <p id="infoStats">Memuat data...</p>
        <div class="bar">
          <input id="cari" type="text" placeholder="Cari nama, NIP, jabatan, atau kata kunci..." />
          <select id="filterDivisi"><option value="">Semua Divisi</option></select>
          <button class="act" onclick="resetSemua()">Reset</button>
          <button class="act primary" onclick="muat()">Refresh Data</button>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="k-label">Data Ditampilkan</div>
          <div class="k-val" id="kpiTampil">0</div>
        </div>
        <div class="kpi">
          <div class="k-label">Laki - Laki</div>
          <div class="k-val" id="kpiLaki">0</div>
        </div>
        <div class="kpi">
          <div class="k-label">Perempuan</div>
          <div class="k-val" id="kpiPerempuan">0</div>
        </div>
        <div class="kpi">
          <div class="k-label">Jumlah Divisi</div>
          <div class="k-val" id="kpiDivisi">0</div>
        </div>
      </div>

      <div class="cards" id="kartuDivisi"></div>

      <div class="table-top">
        <span style="font-weight:700; font-size:14px;">Daftar Pegawai</span>
        <button class="btn-mini" onclick="unduhCSV()">Unduh CSV Hasil Filter</button>
      </div>

      <div class="box">
        <table>
          <thead><tr id="kepalaTabel"></tr></thead>
          <tbody id="isiTabel"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal" onclick="if(event.target.id==='modal') tutupModal()">
    <div class="modal-isi">
      <h3 style="margin-top:0;" id="modalJudul">Detail Karyawan</h3>
      <div id="detailIsi"></div>
      <div class="modal-actions">
        <button class="btn-sec" id="btnSalinNip" onclick="salinNilai('nip')">Salin NIP</button>
        <button class="btn-sec" id="btnSalinEmail" onclick="salinNilai('email')">Salin Email</button>
        <button class="btn-dark" onclick="tutupModal()">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const URL_DATA = "https://script.google.com/macros/s/AKfycbzKrn6vwNSM5hJGywoYmEXzKwA_rjFKeu9YRQq3lcNdYyO6Z0wIgNC2PYU1DmKNtm7l/exec";
    const ABAIKAN = ["data karyawan november 2026"];
    const URUTAN = ["manajemen office", "engineering", "engieering", "security", "housekeeping", "banquet", "sopir", "resepsionis"];

    let semuaData = [];
    let hasilTerakhir = [];
    let kolomList = [];
    let dataModalAktif = null;

    function getDiv(row) {
      return String(row.Divisi || row.DIvisi || row.divisi || "").trim();
    }

    function getGender(row) {
      return String(row["Jenis Kelamin"] || row["jenis kelamin"] || "").trim().toLowerCase();
    }

    function getNip(row) {
      return String(row.NIP || row.nip || "").trim();
    }

    function getEmail(row) {
      return String(row["Alamat Email"] || row.Email || row.email || "").trim();
    }

    function diabaikan(nama) {
      return ABAIKAN.indexOf(String(nama || "").trim().toLowerCase()) !== -1;
    }

    function urutDiv(arr) {
      return arr.slice().sort(function(a, b) {
        var ia = URUTAN.indexOf(a.toLowerCase());
        var ib = URUTAN.indexOf(b.toLowerCase());
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a.localeCompare(b);
      });
    }

    function inisial(teks) {
      var kata = String(teks || "PG").trim().split(/\s+/).filter(Boolean);
      if (!kata.length) return "PG";
      if (kata.length === 1) return kata[0].slice(0, 2).toUpperCase();
      return ((kata[0][0] || "") + (kata[1][0] || "")).toUpperCase();
    }

    async function muat() {
      document.getElementById("infoStats").textContent = "Memuat data terbaru...";
      try {
        var res = await fetch(URL_DATA);
        var json = await res.json();
        var raw = Array.isArray(json) ? json : (Array.isArray(json && json.data) ? json.data : []);
        semuaData = raw.filter(function(r) { return !diabaikan(getDiv(r)); });

        var setK = {};
        semuaData.forEach(function(r) {
          Object.keys(r || {}).forEach(function(k) { setK[k] = 1; });
        });
        kolomList = Object.keys(setK);
        document.getElementById("kepalaTabel").innerHTML = kolomList.map(function(k) { return "<th>" + k + "</th>"; }).join("");

        bangunDivisi();
        tampil();
      } catch (e) {
        document.getElementById("infoStats").textContent = "Gagal memuat data: " + e.message;
      }
    }

    function bangunDivisi() {
      var hitung = {};
      semuaData.forEach(function(r) {
        var d = getDiv(r);
        if (d && !diabaikan(d)) hitung[d] = (hitung[d] || 0) + 1;
      });
      var listDiv = urutDiv(Object.keys(hitung));
      var divAktif = document.getElementById("filterDivisi").value;

      document.getElementById("jmlSemua").textContent = semuaData.length;
      document.getElementById("kpiDivisi").textContent = listDiv.length;

      document.getElementById("filterDivisi").innerHTML = '<option value="">Semua Divisi</option>' +
        listDiv.map(function(d) { return '<option value="' + d + '">' + d + ' (' + hitung[d] + ')</option>'; }).join("");
      document.getElementById("filterDivisi").value = divAktif;

      document.getElementById("menuDivisi").innerHTML = listDiv.map(function(d) {
        var aktifClass = divAktif === d ? " aktif" : "";
        return '<button class="nav-btn' + aktifClass + '" data-d="' + d + '" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><span>' + d + '</span><span class="badge-jml">' + hitung[d] + '</span></button>';
      }).join("");

      document.getElementById("kartuDivisi").innerHTML = listDiv.map(function(d) {
        var aktifClass = divAktif === d ? " aktif" : "";
        return '<div class="card' + aktifClass + '" onclick="pilihDivisi(\'' + d.replace(/'/g, "\\'") + '\')"><b>' + d + '</b><div style="font-size:12px;color:#64748b;margin-top:4px;">' + hitung[d] + ' pegawai</div></div>';
      }).join("");
    }

    function pilihDivisi(d) {
      document.getElementById("filterDivisi").value = d;
      document.querySelectorAll(".nav-btn").forEach(function(b) {
        b.classList.toggle("aktif", (d === "" && b.id === "btnSemua") || b.getAttribute("data-d") === d);
      });
      document.querySelectorAll("#kartuDivisi .card").forEach(function(c) {
        var judul = c.querySelector("b") ? c.querySelector("b").textContent.trim() : "";
        c.classList.toggle("aktif", Boolean(d) && judul === d);
      });
      tampil();
    }

    function resetSemua() {
      document.getElementById("cari").value = "";
      pilihDivisi("");
    }

    function tutupModal() {
      document.getElementById("modal").classList.remove("aktif");
      dataModalAktif = null;
    }

    function salinNilai(jenis) {
      if (!dataModalAktif) return;
      var nilai = jenis === "nip" ? getNip(dataModalAktif) : getEmail(dataModalAktif);
      if (!nilai) {
        alert(jenis === "nip" ? "NIP kosong." : "Email kosong.");
        return;
      }
      navigator.clipboard.writeText(nilai).then(function() {
        alert((jenis === "nip" ? "NIP " : "Email ") + nilai + " berhasil disalin.");
      });
    }

    function formatSel(kolom, nilai) {
      var teks = String(nilai || "");
      var kl = kolom.toLowerCase();
      if (kl.indexOf("nama") !== -1 && teks) {
        return '<span class="avatar">' + inisial(teks) + '</span><span>' + teks + '</span>';
      }
      if (kl === "divisi" && teks) {
        return '<span class="pill">' + teks + '</span>';
      }
      return teks;
    }

    function unduhCSV() {
      if (!hasilTerakhir.length) {
        alert("Tidak ada data untuk diunduh.");
        return;
      }
      var barisCsv = [kolomList.map(function(k) { return '"' + String(k).replace(/"/g, '""') + '"'; }).join(",")];
      hasilTerakhir.forEach(function(r) {
        var rowCsv = kolomList.map(function(k) {
          return '"' + String(r[k] || "").replace(/"/g, '""') + '"';
        }).join(",");
        barisCsv.push(rowCsv);
      });
      var blob = new Blob([barisCsv.join("\n")], { type: "text/csv;charset=utf-8;" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "data-karyawan-bm-kpdjp-2026.csv";
      link.click();
    }

    function tampil() {
      var kata = document.getElementById("cari").value.toLowerCase().trim();
      var div = document.getElementById("filterDivisi").value;

      var saring = semuaData.filter(function(r) {
        var okD = !div || getDiv(r) === div;
        var okK = !kata || Object.values(r).some(function(v) { return String(v || "").toLowerCase().indexOf(kata) !== -1; });
        return okD && okK;
      });
      hasilTerakhir = saring;

      var jmlLaki = saring.filter(function(r) { return getGender(r).indexOf("laki") !== -1; }).length;
      var jmlPerempuan = saring.filter(function(r) { return getGender(r).indexOf("perempuan") !== -1; }).length;

      document.getElementById("infoStats").textContent = "Menampilkan " + saring.length + " dari " + semuaData.length + " data";
      document.getElementById("kpiTampil").textContent = saring.length;
      document.getElementById("kpiLaki").textContent = jmlLaki;
      document.getElementById("kpiPerempuan").textContent = jmlPerempuan;

      var tbody = document.getElementById("isiTabel");
      tbody.innerHTML = "";
      saring.forEach(function(r) {
        var tr = document.createElement("tr");
        tr.innerHTML = kolomList.map(function(k) { return "<td>" + formatSel(k, r[k]) + "</td>"; }).join("");
        tr.onclick = function() {
          dataModalAktif = r;
          var nama = r["Nama Lengkap (Sesuai KTP)"] || r.Nama || "Detail Karyawan";
          document.getElementById("modalJudul").textContent = nama;
          document.getElementById("detailIsi").innerHTML = kolomList.map(function(k) {
            return "<p style='margin:6px 0;'><b>" + k + ":</b> " + (r[k] || "-") + "</p>";
          }).join("");
          document.getElementById("modal").classList.add("aktif");
        };
        tbody.appendChild(tr);
      });
    }

    document.getElementById("cari").addEventListener("input", tampil);
    document.getElementById("filterDivisi").addEventListener("change", function(e) { pilihDivisi(e.target.value); });

    muat();
  </script>
</body>
</html>
