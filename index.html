<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Karyawan</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; margin: 0; }
    .box { max-width: 1000px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
    .bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    input, select { padding: 8px 10px; font-size: 14px; }
    input { flex: 1; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f0f2f5; }
    tr:hover { background: #f9fafb; cursor: pointer; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
    #modal.aktif { display: flex; }
    .modal-isi { background: #fff; padding: 20px; border-radius: 8px; max-width: 480px; width: 90%; max-height: 80vh; overflow: auto; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Data Karyawan</h2>
    <div class="bar">
      <input id="cari" type="text" placeholder="Cari nama, NIP, atau kata apa saja..." />
      <select id="filterDivisi"><option value="">Semua Divisi</option></select>
    </div>
    <p id="status">Memuat data...</p>
    <div style="overflow-x:auto">
      <table>
        <thead><tr id="kepalaTabel"></tr></thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

  <div id="modal">
    <div class="modal-isi">
      <h3>Detail Karyawan</h3>
      <div id="detailIsi"></div>
      <br />
      <button onclick="document.getElementById('modal').classList.remove('aktif')">Tutup</button>
    </div>
  </div>

  <script>
    const URL_DATA = "https://script.google.com/macros/s/AKfycbzKrn6vwNSM5hJGywoYmEXzKwA_rjFKeu9YRQq3lcNdYyO6Z0wIgNC2PYU1DmKNtm7l/exec";
    let semuaData = [];
    let daftarKolom = [];

    async function ambilData() {
      try {
        const respon = await fetch(URL_DATA);
        semuaData = await respon.json();
        siapkanKolom();
        siapkanDivisi();
        tampilkan();
      } catch (e) {
        document.getElementById("status").textContent = "Gagal ambil data: " + e.message;
      }
    }

    function siapkanKolom() {
      const setKolom = new Set();
      semuaData.forEach(row => Object.keys(row).forEach(k => setKolom.add(k)));
      daftarKolom = Array.from(setKolom);
      document.getElementById("kepalaTabel").innerHTML = daftarKolom.map(k => `<th>${k}</th>`).join("");
    }

    function siapkanDivisi() {
      const divisiUnik = [...new Set(semuaData.map(r => r.Divisi).filter(Boolean))].sort();
      const select = document.getElementById("filterDivisi");
      select.innerHTML = '<option value="">Semua Divisi</option>' + divisiUnik.map(d => `<option value="${d}">${d}</option>`).join("");
    }

    function tampilkan() {
      const kata = document.getElementById("cari").value.toLowerCase().trim();
      const div = document.getElementById("filterDivisi").value;

      const saring = semuaData.filter(row => {
        const cocokDiv = !div || row.Divisi === div;
        const cocokKata = !kata || Object.values(row).some(v => String(v ?? "").toLowerCase().includes(kata));
        return cocokDiv && cocokKata;
      });

      document.getElementById("status").textContent = `Menampilkan ${saring.length} dari ${semuaData.length} data.`;
      const tbody = document.getElementById("isiTabel");
      tbody.innerHTML = "";

      saring.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = daftarKolom.map(k => `<td>${row[k] ?? ""}</td>`).join("");
        tr.onclick = () => {
          document.getElementById("detailIsi").innerHTML = daftarKolom
            .map(k => `<p><b>${k}:</b> ${row[k] ?? "-"}</p>`)
            .join("");
          document.getElementById("modal").classList.add("aktif");
        };
        tbody.appendChild(tr);
      });
    }

    document.getElementById("cari").addEventListener("input", tampilkan);
    document.getElementById("filterDivisi").addEventListener("change", tampilkan);
    ambilData();
  </script>
</body>
</html>
